#: Selecionar e agir em texto visível {{{

#: Use o kitten hints para selecionar texto e passá-lo para um
#: programa externo ou inseri-lo no terminal ou copiá-lo para a área
#: de transferência.

#: Abrir URL

# map kitty_mod+e open_url_with_hints

#::  Abrir uma URL atualmente visível usando o teclado. O programa
#::  usado para abrir a URL é especificado em open_url_with.

#: Inserir caminho selecionado

# map kitty_mod+p>f kitten hints --type path --program -

#::  Selecionar um caminho/nome de arquivo e inseri-lo no terminal.
#::  Útil, por exemplo, para executar comandos git em um nome de
#::  arquivo de saída de um comando git anterior.

#: Abrir caminho selecionado

# map kitty_mod+p>shift+f kitten hints --type path

#::  Selecionar um caminho/nome de arquivo e abri-lo com o programa de
#::  abertura padrão.

#: Inserir linha selecionada

# map kitty_mod+p>l kitten hints --type line --program -

#::  Selecionar uma linha de texto e inseri-la no terminal. Útil para
#::  a saída de coisas como: `ls -1`.

#: Inserir palavra selecionada

# map kitty_mod+p>w kitten hints --type word --program -

#::  Selecionar palavras e inserir no terminal.

#: Inserir hash selecionado

# map kitty_mod+p>h kitten hints --type hash --program -

#::  Selecionar algo que pareça um hash e inseri-lo no terminal. Útil
#::  com git, que usa hashes SHA1 para identificar commits.

#: Abrir o arquivo selecionado na linha selecionada

# map kitty_mod+p>n kitten hints --type linenum

#::  Selecionar algo que pareça nome de arquivo:numlinha e abri-lo no
#::  seu editor padrão no número de linha especificado.

#: Abrir o hyperlink selecionado

# map kitty_mod+p>y kitten hints --type hyperlink

#::  Selecionar um hyperlink (ou seja, uma URL que foi marcada como tal
#::  pelo programa do terminal, por exemplo, por `ls --hyperlink=auto`).


#: O kitten hints tem muitos mais modos de operação que você pode
#: mapear para atalhos diferentes. Para uma descrição completa, veja
#: hints kitten <https://sw.kovidgoyal.net/kitty/kittens/hints/>.
#: }}}

#: Diversos {{{

#: Mostrar documentação

# map kitty_mod+f1 show_kitty_doc overview

#: Alternar tela cheia

# map kitty_mod+f11 toggle_fullscreen
# map ctrl+cmd+f    toggle_fullscreen

#: Alternar maximizado

# map kitty_mod+f10 toggle_maximized

#: Alternar entrada de teclado segura do macOS

# map opt+cmd+s toggle_macos_secure_keyboard_entry

#: Entrada Unicode

# map kitty_mod+u    kitten unicode_input
# map ctrl+cmd+space kitten unicode_input

#: Editar arquivo de configuração

# map kitty_mod+f2 edit_config_file
# map cmd+,        edit_config_file

#: Abrir o shell de comando do kitty

# map kitty_mod+escape kitty_shell window

#::  Abrir o shell do kitty em uma nova janela / aba / sobreposição /
#::  os_window para controlar o kitty usando comandos.

#: Aumentar opacidade do fundo

# map kitty_mod+a>m set_background_opacity +0.1

#: Diminuir opacidade do fundo

# map kitty_mod+a>l set_background_opacity -0.1

#: Tornar o fundo totalmente opaco

# map kitty_mod+a>1 set_background_opacity 1

#: Redefinir opacidade do fundo

# map kitty_mod+a>d set_background_opacity default

#: Redefinir o terminal

# map kitty_mod+delete clear_terminal reset active
# map opt+cmd+r        clear_terminal reset active

#::  Você pode criar atalhos para limpar/redefinir o terminal. Por
#::  exemplo::

#::      # Redefinir o terminal
#::      map f1 clear_terminal reset active
#::      # Limpar a tela do terminal apagando todo o conteúdo
#::      map f1 clear_terminal clear active
#::      # Limpar o histórico de rolagem do terminal apagando-o
#::      map f1 clear_terminal scrollback active
#::      # Rolar o conteúdo da tela para o histórico de rolagem
#::      map f1 clear_terminal scroll active
#::      # Limpar tudo na tela até a linha com o cursor ou o início do prompt atual (precisa de integração de shell)
#::      map f1 clear_terminal to_cursor active
#::      # O mesmo que acima, exceto que as linhas limpas são movidas para o histórico de rolagem
#::      map f1 clear_terminal to_cursor_scroll active

#::  Se você quiser operar em todas as janelas do kitty em vez de
#::  apenas a atual, use all em vez de active.

#::  Algumas funções úteis que podem ser definidas nos arquivos rc do
#::  shell para realizar vários tipos de limpeza da janela atual:

#::  .. code-block:: sh

#::      clear-only-screen() {
#::          printf "\e[H\e[2J"
#::      }

#::      clear-screen-and-scrollback() {
#::          printf "\e[H\e[3J"
#::      }

#::      clear-screen-saving-contents-in-scrollback() {
#::          printf "\e[H\e[22J"
#::      }

#::  Por exemplo, usando esses códigos de escape, é possível remapear
#::  Ctrl+L para tanto rolar o conteúdo da tela atual para o buffer
#::  de histórico de rolagem quanto limpar a tela, em vez de apenas
#::  limpar a tela. Para ZSH, em ~/.zshrc, adicione:

#::  .. code-block:: zsh

#::      ctrl_l() {
#::          builtin print -rn -- $'\r\e[0J\e[H\e[22J' >"$TTY"
#::          builtin zle .reset-prompt
#::          builtin zle -R
#::      }
#::      zle -N ctrl_l
#::      bindkey '^l' ctrl_l

#::  Alternativamente, você pode simplesmente adicionar map ctrl+l
#::  clear_terminal to_cursor_scroll active a kitty.conf, que funciona
#::  sem alterações nos arquivos rc do shell, mas só limpa até o
#::  prompt, não limpa nenhum texto no próprio prompt.

#: Limpar até a linha do cursor

# map cmd+k clear_terminal to_cursor active

#: Recarregar kitty.conf

# map kitty_mod+f5 load_config_file
# map ctrl+cmd+,   load_config_file

#::  Recarregar kitty.conf, aplicando quaisquer alterações desde a
#::  última vez que foi carregado. Note que algumas opções não podem
#::  ser alteradas dinamicamente e exigem uma reinicialização completa
#::  do kitty. Particularmente, ao alterar atalhos para ações
#::  localizadas na barra de menus global do macOS, uma reinicialização
#::  completa é necessária. Você também pode mapear uma tecla para
#::  carregar um arquivo de configuração diferente, por exemplo::

#::      map f5 load_config /caminho/para/kitty_alternativo.conf

#::  Note que todas as opções do kitty.conf original são descartadas,
#::  em outras palavras, a nova configuração *substitui* as antigas.

#: Depurar configuração do kitty

# map kitty_mod+f6 debug_config
# map opt+cmd+,    debug_config

#::  Mostrar detalhes sobre exatamente qual configuração o kitty está
#::  executando e seu ambiente host. Útil para depurar problemas.

#: Enviar texto arbitrário em pressionamentos de tecla

#::  Ex.: map ctrl+shift+alt+h send_text all Hello World

#::  Você pode dizer ao kitty para enviar texto codificado
#::  arbitrariamente (UTF-8) para o programa cliente ao pressionar
#::  combinações de teclas especificadas. Por exemplo::

#::      map ctrl+alt+a send_text all Texto especial

#::  Isso enviará "Texto especial" quando você pressionar a combinação
#::  de teclas Ctrl+Alt+A. O texto a ser enviado decodifica escapes
#::  ANSI C
#::  <https://www.gnu.org/software/bash/manual/html_node/ANSI_002dC-
#::  Quoting.html> para que você possa usar escapes como \e para
#::  enviar códigos de controle ou \u21fb para enviar caracteres
#::  Unicode (ou você pode simplesmente inserir os caracteres Unicode
#::  diretamente como texto UTF-8). Você pode usar `kitten show-key`
#::  para obter os códigos de escape de tecla que deseja emular.

#::  O primeiro argumento para send_text são os modos de teclado nos
#::  quais ativar o atalho. Os valores possíveis são normal,
#::  application, kitty ou uma combinação separada por vírgulas deles.
#::  Os modos normal e application referem-se ao modo de tecla de
#::  cursor DECCKM para terminais, e kitty refere-se ao protocolo de
#::  teclado estendido do kitty. O valor especial all significa todos
#::  eles.

#::  Mais alguns exemplos::

#::      # Emitir uma palavra e mover o cursor para o início da linha (como digitar e pressionar Home)
#::      map ctrl+alt+a send_text normal Word\e[H
#::      map ctrl+alt+a send_text application Word\eOH
#::      # Executar um comando em um prompt de shell (como digitar o comando e pressionar Enter)
#::      map ctrl+alt+a send_text normal,application algum comando com argumentos\r

#: Abrir site do kitty

