confirm_os_window_close 0
cursor_trail 1
cursor_shape beam
cursor_beam_thickness 4
cursor_stop_blinking_after 0
cursor_shape_unfocused unchanged
font_size 11.0
cursor_blink_interval 0.5
window_padding_width 25
font_family     Jetbrains Mono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
background_opacity 0.9

#: Fontes {{{

#: O kitty tem um gerenciamento de fontes muito poderoso. Você pode configurar
#: faces de fonte individuais e até especificar fontes especiais para
#: caracteres específicos.

# font_family      monospace
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

#: Você pode especificar fontes diferentes para as variantes
#: negrito/itálico/negrito-itálico. A maneira mais fácil de selecionar
#: fontes é executar o comando `kitten choose-fonts`, que apresentará uma
#: bela interface para você selecionar as fontes desejadas com pré-visualizações
#: e suporte para selecionar fontes variáveis e recursos de fonte. Se você
#: quiser aprender a selecionar fontes manualmente, leia a sintaxe de
#: especificação de fontes
#: <https://sw.kovidgoyal.net/kitty/kittens/choose-fonts/#font-spec-
#: syntax>.

# font_size 11.0

#: Tamanho da fonte (em pontos).

# force_ltr no

#: O kitty não suporta BIDI (texto bidirecional), no entanto, para scripts
#: RTL, as palavras são automaticamente exibidas em RTL. Ou seja, em um
#: script RTL, as palavras "HELLO WORLD" são exibidas no kitty como
#: "WORLD HELLO", e se você tentar selecionar uma substring de uma string
#: com forma RTL, você obterá o caractere que estaria lá se a string fosse
#: LTR. Por exemplo, assumindo a palavra hebraica ירושלים, selecionar o
#: caractere que na tela parece ser ם na verdade escreve no buffer de
#: seleção o caractere י. O comportamento padrão do kitty é útil em
#: conjunto com um filtro para inverter a ordem das palavras, no entanto,
#: se você deseja manipular glifos RTL, pode ser muito desafiador
#: trabalhar com eles, então esta opção é fornecida para desativá-lo.
#: Além disso, esta opção pode ser usada com o programa de linha de comando
#: GNU FriBidi <https://github.com/fribidi/fribidi#executable> para obter
#: suporte BIDI, porque forçará o kitty a sempre tratar o texto como LTR,
#: que é o que o FriBidi espera para terminais.

# symbol_map

#: Ex.: symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

#: Mapeia os pontos de código Unicode especificados para uma fonte
#: específica. Útil se você precisar de renderização especial para alguns
#: símbolos, como para Powerline. Evita a necessidade de fontes
#: modificadas. Cada ponto de código Unicode é especificado na forma
#: `U+<ponto de código em hexadecimal>`. Você pode especificar múltiplos
#: pontos de código, separados por vírgulas e intervalos separados por
#: hífens. Esta opção pode ser especificada múltiplas vezes.
#: A sintaxe é::

#:     symbol_map codepoints Nome da Família da Fonte

# narrow_symbols

#: Ex.: narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

#: Normalmente, para caracteres Unicode de Uso Privado e alguns
#: caracteres de símbolo/dingbat, se o caractere for seguido por um ou
#: mais espaços, o kitty usará essas células extras para renderizar o
#: caractere maior, se o caractere na fonte tiver uma proporção larga.
#: Usando esta opção, você pode forçar o kitty a restringir os pontos de
#: código especificados para renderizar no número especificado de células
#: (padrão de uma célula). Esta opção pode ser especificada múltiplas
#: vezes. A sintaxe é::

#:     narrow_symbols codepoints [opcionalmente o número de células]

# disable_ligatures never

#: Escolha como você quer lidar com ligaduras de múltiplos caracteres.
#: O padrão é sempre renderizá-las. Você pode dizer ao kitty para não
#: renderizá-las quando o cursor estiver sobre elas usando cursor para
#: facilitar a edição, ou fazer com que o kitty nunca as renderize
#: usando always, se você não gostar delas. A estratégia de ligaduras
#: pode ser definida por janela, usando a facilidade de controle remoto
#: do kitty ou definindo atalhos para ela em kitty.conf, por exemplo::

#:     map alt+1 disable_ligatures_in active always
#:     map alt+2 disable_ligatures_in all never
#:     map alt+3 disable_ligatures_in tab cursor

#: Note que isso se refere a ligaduras de programação, tipicamente
#: implementadas usando o recurso OpenType calt. Para desabilitar
#: ligaduras gerais, use a opção font_features.

# font_features

#: Ex.: font_features none

#: Escolha exatamente quais recursos OpenType habilitar ou desabilitar.
#: Note que para as fontes principais, os recursos podem ser
#: especificados ao selecionar a fonte usando o kitten choose-fonts.
#: Esta configuração é útil para fontes de fallback.

#: Algumas fontes podem ter recursos que valem a pena em um terminal.
#: Por exemplo, Fira Code inclui um recurso discricionário, zero, que
#: nessa fonte altera a aparência do zero (0), para torná-lo mais
#: facilmente distinguível de Ø. Fira Code também inclui outros
#: recursos discricionários conhecidos como Stylistic Sets, que têm as
#: tags ss01 a ss20.

#: Para a sintaxe exata a ser usada para recursos individuais, veja a
#: documentação do HarfBuzz <https://harfbuzz.github.io/harfbuzz-hb-
#: common.html#hb-feature-from-string>.

#: Note que este código é indexado pelo nome PostScript, e não pela
#: família da fonte. Isso permite que você defina configurações de
#: recursos muito precisas; por exemplo, você pode desabilitar um
#: recurso na fonte itálica, mas não na fonte regular.

#: No Linux, os recursos de fonte são primeiro lidos do banco de dados
#: FontConfig e depois esta opção é aplicada, então eles podem ser
#: configurados em um único local central.

#: Para obter o nome PostScript de uma fonte, use o comando
#: `fc-scan file.ttf` no Linux ou a ferramenta Font Book no macOS
#: <https://apple.stackexchange.com/questions/79875/how-can-i-get-the-
#: postscript-name-of-a-ttf-font-installed-in-os-x>`__.

#: Habilitar zero alternativo e numerais oldstyle::

#:     font_features FiraCode-Retina +zero +onum

#: Habilitar apenas zero alternativo na fonte negrito::

#:     font_features FiraCode-Bold +zero

#: Desabilitar as ligaduras normais, mas manter o recurso calt que
#: (nesta fonte) quebra a monotonia::

#:     font_features TT2020StyleB-Regular -liga +calt

#: Em conjunto com force_ltr, você pode querer desabilitar
#: completamente a modelagem árabe, e olhar apenas para suas formas
#: isoladas se elas aparecerem em um documento. Você pode fazer isso
#: com, por exemplo::

#:     font_features UnifontMedium +isol -medi -fina -init

# modify_font

#: Modificar características da fonte, como a posição ou espessura do
#: sublinhado e tachado. As modificações podem ter o sufixo px para
#: pixels ou % para porcentagem do valor original. Sem sufixo significa
#: usar pontos. Por exemplo::

#:     modify_font underline_position -2
#:     modify_font underline_thickness 150%
#:     modify_font strikethrough_position 2px

#: Adicionalmente, você pode modificar o tamanho da célula na qual cada
#: glifo da fonte é renderizado e a linha de base na qual o glifo é
#: colocado na célula. Por exemplo::

#:     modify_font cell_width 80%
#:     modify_font cell_height -2px
#:     modify_font baseline 3

#: Note que modificar a linha de base ajustará automaticamente as
#: posições de sublinhado e tachado na mesma quantidade. Aumentar a
#: linha de base eleva os glifos dentro da célula e diminuí-la os
#: abaixa. Diminuir o tamanho da célula pode causar artefatos de
#: renderização, então use com cuidado.

# box_drawing_scale 0.001, 1, 1.5, 2

#: Os tamanhos das linhas usadas para os caracteres Unicode de desenho
#: de caixa. Esses valores estão em pontos. Eles serão escalados pelo
#: DPI do monitor para chegar a um valor em pixels. Deve haver quatro
#: valores correspondentes a linhas finas, normais, grossas e muito
#: grossas.

# undercurl_style thin-sparse

#: O estilo com o qual os sublinhados ondulados são renderizados. Esta
#: opção assume a forma (thin|thick)-(sparse|dense). Thin e thick
#: controlam a espessura da onda. Sparse e dense controlam a frequência
#: com que a onda oscila. Com sparse, a onda atinge o pico uma vez por
#: caractere; com dense, duas vezes.

# text_composition_strategy platform

#: Controla como o kitty compõe os glifos de texto sobre a cor de
#: fundo. O valor padrão platform tenta a renderização de texto o mais
#: próximo possível do "nativo" para a plataforma na qual o kitty está
#: sendo executado.

#: Um valor de legacy usa a estratégia antiga (pré-kitty 0.28) para
#: como os glifos são compostos. Isso fará com que texto escuro em
#: fundos claros pareça mais grosso e texto claro em fundos escuros
#: mais fino. Também pode fazer com que alguns textos pareçam ter
#: traços irregulares.

#: Você pode ajustar a curva de contraste real usada para a composição
#: de glifos especificando até dois números separados por espaço para
#: esta configuração.

#: O primeiro número é o ajuste de gamma, que controla a espessura do
#: texto escuro em fundos claros. Aumentar o valor fará o texto parecer
#: mais grosso. O valor padrão para isso é 1.0 no Linux e 1.7 no macOS.
#: Valores válidos são 0.01 e acima. O resultado é escalado com base na
#: diferença de luminância entre o fundo e o primeiro plano. Texto
#: escuro em fundos claros recebe o impacto total da curva, enquanto
#: texto claro em fundos escuros é afetado muito pouco.

#: O segundo número é um contraste multiplicativo adicional. É uma
#: porcentagem que varia de 0 a 100. O valor padrão é 0 no Linux e 30
#: no macOS.

#: Se você deseja alcançar espessura visual semelhante em temas claros
#: e escuros, uma boa maneira de experimentar é começar definindo o
#: valor para 1.0 0 e usar um tema escuro. Então ajuste o segundo
#: parâmetro até que pareça bom. Depois mude para um tema claro e
#: ajuste o primeiro parâmetro até que a espessura percebida
#: corresponda ao tema escuro.

# text_fg_override_threshold 0

#: A diferença mínima aceita em luminância entre a cor de primeiro
#: plano e a de fundo, abaixo da qual o kitty substituirá a cor de
#: primeiro plano. É uma porcentagem que varia de 0 a 100. Se a
#: diferença em luminância do primeiro plano e do fundo estiver abaixo
#: deste limiar, a cor de primeiro plano será definida como branco se
#: o fundo for escuro ou preto se o fundo for claro. O valor padrão é
#: 0, o que significa que nenhuma substituição é realizada. Útil ao
#: trabalhar com aplicativos que usam cores que não contrastam bem com
#: seu esquema de cores preferido.

#: AVISO: Alguns programas usam caracteres (como caracteres de bloco)
#: para exibição gráfica e podem esperar poder definir o primeiro plano
#: e o fundo para a mesma cor (ou cores semelhantes). Se você vir
#: listras, pontos, linhas, cores incorretas, ausência de cor onde
#: espera cor, ou qualquer tipo de problema de exibição gráfica,
#: tente definir text_fg_override_threshold como 0 para ver se esta é
#: a causa do problema.

#: }}}

#: Personalização do cursor de texto {{{

# cursor #cccccc

#: Cor padrão do cursor de texto. Se definido como o valor especial
#: none, o cursor será renderizado com um efeito de "vídeo reverso".
#: Sua cor será a cor do texto na célula sobre a qual está e o texto
#: será renderizado com a cor de fundo da célula. Note que se o
#: programa em execução no terminal definir uma cor de cursor, esta
#: terá precedência. Além disso, as cores do cursor são modificadas se
#: as cores de fundo e primeiro plano da célula tiverem contraste
#: muito baixo. Note que alguns temas definem este valor, então se
#: você quiser substituí-lo, coloque seu valor após as linhas onde o
#: arquivo de tema é incluído.

# cursor_text_color #111111

#: A cor do texto sob o cursor. Se você quiser que ele seja
#: renderizado com a cor de fundo da célula abaixo, use a palavra-chave
#: especial: `background`. Note que se cursor estiver definido como
#: none, então esta opção é ignorada. Note que alguns temas definem
#: este valor, então se você quiser substituí-lo, coloque seu valor
#: após as linhas onde o arquivo de tema é incluído.

# cursor_shape block

#: A forma do cursor pode ser uma de block, beam, underline. Note que
#: ao recarregar a configuração, isso só será alterado se a forma do
#: cursor não tiver sido definida pelo programa em execução no
#: terminal. Isso define a forma padrão do cursor; aplicativos em
#: execução no terminal podem substituí-la. Em particular, a
#: integração de shell <https://sw.kovidgoyal.net/kitty/shell-
#: integration/> no kitty define a forma do cursor como beam nos
#: prompts do shell. Você pode evitar isso definindo shell_integration
#: como no-cursor.

# cursor_shape_unfocused hollow

#: Define a forma do cursor de texto quando a janela do SO não está
#: focada. A forma do cursor não focado pode ser uma de block, beam,
#: underline, hollow e unchanged (deixar a forma do cursor como está).

# cursor_beam_thickness 1.5

#: A espessura do cursor beam (em pontos).

# cursor_underline_thickness 2.0

#: A espessura do cursor underline (em pontos).

# cursor_blink_interval -1

#: O intervalo para piscar o cursor (em segundos). Defina como zero
#: para desabilitar o piscar. Valores negativos significam usar o
#: padrão do sistema. Note que o intervalo mínimo será limitado a
#: repaint_delay. Você também pode animar o piscar do cursor
#: especificando uma função de easing. Por exemplo, definir esta opção
#: como 0.5 ease-in-out fará com que o piscar do cursor seja animado
#: ao longo de um segundo; na primeira metade do segundo ele irá de
#: opaco a transparente e depois voltará ao longo da metade seguinte.
#: Você pode especificar diferentes funções de easing para as duas
#: metades, por exemplo: -1 linear ease-out. O kitty suporta todas as
#: funções de easing CSS <https://developer.mozilla.org/en-
#: US/docs/Web/CSS/easing-function>. Note que ativar animações usa
#: energia extra, pois significa que a tela é redesenhada múltiplas
#: vezes por intervalo de piscar. Veja também cursor_stop_blinking_after.

# cursor_stop_blinking_after 15.0

#: Parar de piscar o cursor após o número especificado de segundos de
#: inatividade do teclado. Defina como zero para nunca parar de
#: piscar.

# cursor_trail 0

#: Defina isto como um valor maior que zero para habilitar uma
#: animação de "rastro do cursor". Esta é uma animação que mostra um
#: "rastro" seguindo o movimento do cursor de texto. Isso facilita
#: acompanhar grandes saltos do cursor e produz um efeito visual legal
#: do cursor zunindo pela tela. O valor real desta opção controla
#: quando a animação é acionada. É um número de milissegundos. A
#: animação de rastro só segue cursores que permaneceram em sua
#: posição por mais tempo que o número especificado de milissegundos.
#: Isso evita que rastros apareçam para cursores que mudam rapidamente
#: suas posições durante atualizações de UI em aplicativos complexos.
#: Veja cursor_trail_decay para controlar a velocidade da animação e
#: cursor_trail_start_threshold para controlar quando um rastro de
#: cursor é iniciado.

# cursor_trail_decay 0.1 0.4

#: Controla os tempos de decaimento para o efeito de rastro do cursor
#: quando cursor_trail está habilitado. Esta opção aceita dois valores
#: float positivos especificando os tempos de decaimento mais rápido e
#: mais lento em segundos. O primeiro valor corresponde ao tempo de
#: decaimento mais rápido (mínimo), e o segundo valor corresponde ao
#: tempo de decaimento mais lento (máximo). O segundo valor deve ser
#: igual ou maior que o primeiro valor. Valores menores resultam em um
#: decaimento mais rápido do rastro do cursor. Ajuste esses valores
#: para controlar quão rapidamente o rastro do cursor desaparece.

# cursor_trail_start_threshold 2

#: Define o limiar de distância para iniciar o rastro do cursor. Esta
#: opção aceita um valor inteiro positivo que representa o número
#: mínimo de células que o cursor deve se mover antes que o rastro
#: seja iniciado. Quando o cursor se move menos que este limiar, o
#: rastro é pulado, reduzindo animação desnecessária de rastro do
#: cursor.

#: }}}

#: Histórico de rolagem {{{

 scrollback_lines 10000

#: Número de linhas de histórico para manter na memória para rolar de
#: volta. A memória é alocada sob demanda. Números negativos são
#: (efetivamente) histórico infinito. Note que usar um histórico muito
#: grande não é recomendado, pois pode desacelerar o desempenho do
#: terminal e também usar grandes quantidades de RAM. Em vez disso,
#: considere usar scrollback_pager_history_size. Note que ao recarregar
#: a configuração, se isso for alterado, afetará apenas janelas
#: recém-criadas, não as existentes.

# scrollback_indicator_opacity 1.0

#: A opacidade do indicador de histórico de rolagem, que é um pequeno
#: retângulo colorido que se move ao longo do lado direito da janela
#: conforme você rola, indicando qual fração você rolou. O padrão é
#: um, o que significa totalmente opaco, ou seja, visível. Defina como
#: um valor entre zero e um para tornar o indicador menos visível.

# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

#: Programa com o qual visualizar o histórico de rolagem em uma nova
#: janela. O buffer de histórico de rolagem é passado como STDIN para
#: este programa. Se você alterá-lo, certifique-se de que o programa
#: que você usa pode lidar com sequências de escape ANSI para cores e
#: formatação de texto. INPUT_LINE_NUMBER na linha de comando acima
#: será substituído por um inteiro representando qual linha deve estar
#: no topo da tela. Similarmente CURSOR_LINE e CURSOR_COLUMN serão
#: substituídos pela posição atual do cursor ou definidos como 0 se não
#: houver cursor, por exemplo, ao mostrar a saída do último comando.

# scrollback_pager_history_size 0

#: Tamanho separado do histórico de rolagem (em MB), usado apenas para
#: navegar no buffer de histórico de rolagem com o pager. Este buffer
#: separado não está disponível para rolagem interativa, mas será
#: canalizado para o programa pager ao visualizar o buffer de histórico
#: de rolagem em uma janela separada. A implementação atual armazena os
#: dados em UTF-8, então aproximadamente 10000 linhas por megabyte a
#: 100 caracteres por linha, para texto ASCII puro e não formatado. Um
#: valor de zero ou menos desabilita este recurso. O tamanho máximo
#: permitido é 4GB. Note que ao recarregar a configuração, se isso for
#: alterado, afetará apenas janelas recém-criadas, não as existentes.

# scrollback_fill_enlarged_window no

#: Preencher novo espaço com linhas do buffer de histórico de rolagem
#: após ampliar uma janela.

# wheel_scroll_multiplier 5.0

#: Multiplicador para o número de linhas roladas pela roda do mouse.
#: Note que isso é usado apenas para dispositivos de rolagem de baixa
#: precisão, não para dispositivos de rolagem de alta precisão em
#: plataformas como macOS e Wayland. Use números negativos para
#: alterar a direção da rolagem. Veja também wheel_scroll_min_lines.

# wheel_scroll_min_lines 1

#: O número mínimo de linhas roladas pela roda do mouse. O
#: multiplicador de rolagem wheel_scroll_multiplier só tem efeito
#: depois de atingir este número. Note que isso é usado apenas para
#: dispositivos de rolagem de baixa precisão, como mouses de roda que
#: rolam em quantidades muito pequenas ao usar a roda. Com um número
#: negativo, o número mínimo de linhas será sempre adicionado.

# touch_scroll_multiplier 3.0

#: Multiplicador para o número de linhas roladas por um touchpad. Note
#: que isso é usado apenas para dispositivos de rolagem de alta
#: precisão em plataformas como macOS e Wayland. Use números negativos
#: para alterar a direção da rolagem.

#: }}}

#: Mouse {{{

# mouse_hide_wait 3.0

#: Ocultar o cursor do mouse após o número especificado de segundos
#: sem usar o mouse. Defina como zero para desabilitar o ocultamento
#: do cursor do mouse. Defina como um valor negativo para ocultar o
#: cursor do mouse imediatamente ao digitar texto. Desabilitado por
#: padrão no macOS, pois fazê-lo funcionar de forma robusta com o mar
#: sempre mutável de bugs que é o Cocoa é esforço demais.

# url_color #0087bd
# url_style curly

#: A cor e o estilo para destacar URLs ao passar o mouse. url_style
#: pode ser um de: none, straight, double, curly, dotted, dashed.

# open_url_with default

#: O programa para abrir URLs clicadas. O valor especial default
#: primeiro procurará por quaisquer manipuladores de URL definidos via
#: a facilidade open_actions
#: <https://sw.kovidgoyal.net/kitty/open_actions/> e, se nenhum for
#: encontrado, usará o manipulador de URL padrão do Sistema
#: Operacional (open no macOS e xdg-open no Linux).

# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

#: O conjunto de prefixos de URL a procurar ao detectar uma URL sob o
#: cursor do mouse.

# detect_urls yes

#: Detectar URLs sob o mouse. URLs detectadas são destacadas com um
#: sublinhado e o cursor do mouse se torna uma mão sobre elas. Mesmo
#: se esta opção estiver desabilitada, URLs ainda são clicáveis. Veja
#: também a opção underline_hyperlinks para controlar como hyperlinks
#: (em oposição a URLs de texto simples) são exibidos.

# url_excluded_characters

#: Caracteres adicionais a serem desabilitados de URLs, ao detectar
#: URLs sob o cursor do mouse. Por padrão, todos os caracteres que são
#: legais em URLs são permitidos. Adicionalmente, novas linhas são
#: permitidas (mas removidas). Isso é para acomodar programas como o
#: mutt que adicionam quebras de linha rígidas mesmo para linhas
#: continuadas. \n pode ser adicionado a esta opção para desabilitar
#: esse comportamento. Caracteres especiais podem ser especificados
#: usando escapes de barra invertida; para especificar uma barra
#: invertida, use uma barra invertida dupla.

# show_hyperlink_targets no

#: Quando o mouse passa sobre um hyperlink de terminal, mostrar a URL
#: real que será ativada quando o hyperlink for clicado.

# underline_hyperlinks hover

#: Controla como os hyperlinks são sublinhados. Eles podem ser
#: sublinhados ao passar o mouse, sempre (ou seja, permanentemente
#: sublinhados) ou nunca, o que significa que o kitty não aplicará
#: nenhum estilo de sublinhado a hyperlinks. Note que o valor always
#: se aplica apenas a hyperlinks reais (OSC 8) e não a texto detectado
#: como URL ao passar o mouse. Usa as configurações url_style e
#: url_color para o estilo de sublinhado. Note que recarregar a
#: configuração e alterar este valor para/de always afetará apenas
#: texto subsequentemente recebido pelo kitty.

copy_on_select yes

#: Copiar para a área de transferência ou um buffer privado ao
#: selecionar. Com isso definido como clipboard, selecionar texto com
#: o mouse fará com que o texto seja copiado para a área de
#: transferência. Útil em plataformas como macOS que não têm o conceito
#: de seleção primária. Você pode, em vez disso, especificar um nome
#: como a1 para copiar para um buffer privado do kitty. Mapeie um
#: atalho com a ação paste_from_buffer para colar deste buffer
#: privado. Por exemplo::

#:     copy_on_select a1
#:     map shift+cmd+v paste_from_buffer a1

#: Note que copiar para a área de transferência é um risco de
#: segurança, pois todos os programas, incluindo sites abertos no seu
#: navegador, podem ler o conteúdo da área de transferência do sistema.

# paste_actions quote-urls-at-prompt,confirm

#: Uma lista separada por vírgulas de ações a tomar ao colar texto no
#: terminal. As ações de colagem suportadas são:

#: quote-urls-at-prompt:
#:     Se o texto sendo colado for uma URL e o cursor estiver em um prompt
#:     de shell, automaticamente colocar a URL entre aspas (precisa de
#:     shell_integration).
#: replace-dangerous-control-codes
#:     Substituir códigos de controle perigosos do texto colado, sem
#:     confirmação.
#: replace-newline
#:     Substituir o caractere de nova linha do texto colado, sem
#:     confirmação.
#: confirm:
#:     Confirmar a colagem se o texto a ser colado contiver quaisquer
#:     códigos de controle de terminal, pois isso pode ser perigoso,
#:     levando à execução de código se o shell/programa em execução no
#:     terminal não lidar adequadamente com eles.
#: confirm-if-large
#:     Confirmar a colagem se for muito grande (maior que 16KB), pois
#:     colar grandes quantidades de texto em shells pode ser muito lento.
#: filter:
#:     Executar a função filter_paste() do arquivo paste-actions.py no
#:     diretório de configuração do kitty no texto colado. O texto
#:     retornado pela função será realmente colado.
#: no-op:
#:     Não tem efeito.

# strip_trailing_spaces never

#: Remover espaços no final das linhas ao copiar para a área de
#: transferência. Um valor de smart fará isso ao usar seleções normais,
#: mas não seleções retangulares. Um valor de always sempre fará isso.

# select_by_word_characters @-./_~?&=%+#

#: Caracteres considerados parte de uma palavra ao clicar duas vezes.
#: Além desses caracteres, qualquer caractere marcado como alfanumérico
#: no banco de dados Unicode será correspondido.

# select_by_word_characters_forward

#: Caracteres considerados parte de uma palavra ao estender a seleção
#: para frente ao clicar duas vezes. Além desses caracteres, qualquer
#: caractere marcado como alfanumérico no banco de dados Unicode será
#: correspondido.

#: Se vazio (padrão), select_by_word_characters será usado para ambas
#: as direções.

# click_interval -1.0

#: O intervalo entre cliques sucessivos para detectar cliques
#: duplos/triplos (em segundos). Números negativos usarão o padrão do
#: sistema, se disponível, ou recorrerão a 0.5.

# focus_follows_mouse no

#: Definir a janela ativa como a janela sob o mouse ao mover o mouse.
#: No macOS, isso também fará com que a Janela do SO sob o mouse seja
#: focada automaticamente quando o mouse entrar nela.

# pointer_shape_when_grabbed arrow

#: A forma do ponteiro do mouse quando o programa em execução no
#: terminal captura o mouse.

# default_pointer_shape beam

#: A forma padrão do ponteiro do mouse.

# pointer_shape_when_dragging beam

#: A forma padrão do ponteiro do mouse ao arrastar sobre texto.

#: Ações do mouse {{{

#: Botões do mouse podem ser mapeados para executar ações arbitrárias.
#: A sintaxe é:

#: .. code-block:: none

#:     mouse_map nome-do-botão tipo-de-evento modos ação

#: Onde nome-do-botão é um de left, middle, right, b1 ... b8 com
#: modificadores de teclado adicionados. Por exemplo: ctrl+shift+left
#: refere-se a segurar as teclas Ctrl+Shift enquanto clica com o botão
#: esquerdo do mouse. O valor b1 ... b8 pode ser usado para se referir
#: a até oito botões em um mouse.

#: tipo-de-evento é um de press, release, doublepress, triplepress,
#: click, doubleclick. modos indica se a ação é executada quando o
#: mouse é capturado pelo programa em execução no terminal, ou não. Os
#: valores são grabbed ou ungrabbed ou uma combinação separada por
#: vírgulas deles. grabbed refere-se a quando o programa em execução no
#: terminal solicitou eventos de mouse. Note que os eventos click e
#: double click têm um atraso de click_interval para desambiguar de
#: double e triple presses.

#: Você pode executar o kitty com a opção de linha de comando kitty
#: --debug-input para ver eventos de mouse. Veja as ações embutidas
#: abaixo para ter uma noção do que é possível.

#: Se você quiser desmapear um botão, mapeie-o para nothing. Por
#: exemplo, para desabilitar a abertura de URLs com um clique simples::

#:     mouse_map left click ungrabbed

#: Veja todas as ações mapeáveis, incluindo ações de mouse, aqui
#: <https://sw.kovidgoyal.net/kitty/actions/>.

#: .. note::
#:     Uma vez que uma seleção é iniciada, soltar o botão que a iniciou
#:     irá automaticamente terminá-la e nenhum evento de release será#:     despachado.

# clear_all_mouse_actions no

#: Remover todas as definições de ações de mouse até este ponto. Útil,
#: por exemplo, para remover as ações de mouse padrão.

#: Clicar no link sob o mouse ou mover o cursor

# mouse_map left click ungrabbed mouse_handle_click selection link prompt

#::  Primeiro verifica se há uma seleção e se existir, não faz nada.
#::  Depois verifica se há um link sob o cursor do mouse e se existir,
#::  clica nele. Finalmente verifica se o clique aconteceu no prompt
#::  atual do shell e, se sim, move o cursor para o local do clique.
#::  Note que isso requer integração de shell
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> para
#::  funcionar.

#: Clicar no link sob o mouse ou mover o cursor mesmo quando capturado

# mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt

#::  O mesmo que acima, exceto que a ação é executada mesmo quando o
#::  mouse é capturado pelo programa em execução no terminal.

#: Clicar no link sob o cursor do mouse

# mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link

#::  A variante com Ctrl+Shift está presente porque a versão baseada em
#::  clique simples tem um atraso inevitável de click_interval, para
#::  desambiguar cliques de cliques duplos.

#: Descartar evento de press para clique em link

# mouse_map ctrl+shift+left press grabbed discard_event

#::  Impedir que este evento de press seja enviado ao programa que
#::  capturou o mouse, já que o evento de release correspondente é
#::  usado para abrir uma URL.

#: Colar da seleção primária

# mouse_map middle release ungrabbed paste_from_selection

#: Começar a selecionar texto

# mouse_map left press ungrabbed mouse_selection normal

#: Começar a selecionar texto em um retângulo

# mouse_map ctrl+alt+left press ungrabbed mouse_selection rectangle

#: Selecionar uma palavra

# mouse_map left doublepress ungrabbed mouse_selection word

#: Selecionar uma linha

# mouse_map left triplepress ungrabbed mouse_selection line

#: Selecionar linha a partir do ponto

# mouse_map ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point

#::  Selecionar do ponto clicado até o final da linha. Se você quiser
#::  selecionar a palavra no ponto e então estender para o resto da
#::  linha, mude `line_from_point` para `word_and_line_from_point`.

#: Estender a seleção atual

# mouse_map right press ungrabbed mouse_selection extend

#::  Se você quiser apenas mover o final da seleção em vez da
#::  fronteira mais próxima, use move-end em vez de extend.

#: Colar da seleção primária mesmo quando capturado

# mouse_map shift+middle release ungrabbed,grabbed paste_selection
# mouse_map shift+middle press grabbed discard_event

#: Começar a selecionar texto mesmo quando capturado

# mouse_map shift+left press ungrabbed,grabbed mouse_selection normal

#: Começar a selecionar texto em um retângulo mesmo quando capturado

# mouse_map ctrl+shift+alt+left press ungrabbed,grabbed mouse_selection rectangle

#: Selecionar uma palavra mesmo quando capturado

# mouse_map shift+left doublepress ungrabbed,grabbed mouse_selection word

#: Selecionar uma linha mesmo quando capturado

# mouse_map shift+left triplepress ungrabbed,grabbed mouse_selection line

#: Selecionar linha a partir do ponto mesmo quando capturado

# mouse_map ctrl+shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_point

#::  Selecionar do ponto clicado até o final da linha mesmo quando
#::  capturado. Se você quiser selecionar a palavra no ponto e então
#::  estender para o resto da linha, mude `line_from_point` para
#::  `word_and_line_from_point`.

#: Estender a seleção atual mesmo quando capturado

# mouse_map shift+right press ungrabbed,grabbed mouse_selection extend

#: Mostrar saída do comando clicado no pager

# mouse_map ctrl+shift+right press ungrabbed mouse_show_command_output

#::  Requer integração de shell
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> para
#::  funcionar.

#: }}}

#: }}}

#: Ajuste de desempenho {{{

# repaint_delay 10

#: Atraso entre atualizações de tela (em milissegundos). Diminuí-lo
#: aumenta quadros por segundo (FPS) ao custo de mais uso de CPU. O
#: valor padrão produz ~100 FPS, o que é mais que suficiente para a
#: maioria dos usos. Note que para realmente atingir 100 FPS, você
#: precisa definir sync_to_monitor como no ou usar um monitor com alta
#: taxa de atualização. Além disso, para minimizar a latência quando há
#: entrada pendente a ser processada, esta opção é ignorada.

# input_delay 3

#: Atraso antes que a entrada do programa em execução no terminal seja
#: processada (em milissegundos). Note que diminuí-lo aumentará a
#: capacidade de resposta, mas também aumentará o uso de CPU e pode
#: causar cintilação em programas de tela cheia que redesenham a tela
#: inteira a cada loop, porque o kitty é tão rápido que atualizações
#: parciais de tela serão desenhadas. Esta configuração é ignorada
#: quando o buffer de entrada está quase cheio.

# sync_to_monitor yes

#: Sincronizar atualizações de tela com a taxa de atualização do
#: monitor. Isso evita rasgos de tela
#: <https://en.wikipedia.org/wiki/Screen_tearing> ao rolar. No entanto,
#: limita a velocidade de renderização à taxa de atualização do seu
#: monitor. Com um mouse muito rápido/taxa de repetição de teclado
#: muito alta, você pode notar alguma leve latência de entrada. Se sim,
#: defina como no.

#: }}}

#: Campainha do terminal {{{

# enable_audio_bell yes

#: A campainha de áudio. Útil para desabilitá-la em ambientes que
#: exigem silêncio.

# visual_bell_duration 0.0

#: A duração da campainha visual (em segundos). Piscar a tela quando
#: uma campainha ocorrer pelo número especificado de segundos. Defina
#: como zero para desabilitar. O flash é animado, aparecendo e
#: desaparecendo gradualmente ao longo da duração especificada. A
#: função de easing usada para o fade pode ser controlada. Por exemplo,
#: 2.0 linear fará com que o flash desapareça linearmente. O padrão se
#: não especificado é usar ease-in-out, que desaparece lentamente no
#: início, meio e fim. Você pode especificar diferentes funções de
#: easing para as partes de fade-in e fade-out, assim: 2.0 ease-in
#: linear. O kitty suporta todas as funções de easing CSS
#: <https://developer.mozilla.org/en-
#: US/docs/Web/CSS/easing-function>.

# visual_bell_color none

#: A cor usada pela campainha visual. Definir como none recorrerá à
#: cor de fundo da seleção. Se você achar que a campainha visual é
#: muito brilhante, você pode defini-la para uma cor mais escura.

# window_alert_on_bell yes

#: Solicitar atenção da janela na campainha. Faz o ícone do dock pular
#: no macOS ou a barra de tarefas piscar no Linux.

# bell_on_tab "🔔 "

#: Algum texto ou um símbolo Unicode para mostrar na aba se uma janela
#: na aba que não tem foco tiver uma campainha. Se você quiser usar
#: espaços à esquerda ou à direita, coloque o texto entre aspas. Veja
#: tab_title_template para como isso é renderizado.

#: Para compatibilidade com versões anteriores, valores de yes, y e
#: true são convertidos para o símbolo de campainha padrão e no, n,
#: false e none são convertidos para a string vazia.

# command_on_bell none

#: Programa para executar quando uma campainha ocorrer. A variável de
#: ambiente KITTY_CHILD_CMDLINE pode ser usada para obter o programa
#: em execução na janela na qual a campainha ocorreu.

# bell_path none

#: Caminho para um arquivo de som para tocar como o som da campainha.
#: Se definido como none, o som de campainha padrão do sistema é usado.
#: Deve estar em um formato suportado pela API de som do sistema
#: operacional, como WAV ou OGA no Linux (libcanberra) ou AIFF, MP3 ou
#: WAV no macOS (NSSound).

# linux_bell_theme __custom

#: O Tema de Som XDG que o kitty usará para tocar o som da campainha.
#: O padrão é o nome do tema personalizado especificado na
#: especificação de tema de som XDG
#: <https://specifications.freedesktop.org/sound-theme-
#: spec/latest/sound_lookup.html>, recorrendo ao tema freedesktop
#: padrão se ele não existir. Para mudar seu tema de som em todo o
#: desktop, crie :file:~/.local/share/sounds/__custom/index.theme` com
#: o conteúdo:

#:     [Sound Theme]

#:     Inherits=name-of-the-sound-theme-you-want-to-use

#: Substitua name-of-the-sound-theme-you-want-to-use pelo nome real do
#: tema. Agora todos os aplicativos compatíveis devem usar sons deste
#: tema.

#: }}}

#: Layout de janela {{{

# remember_window_size  yes
# initial_window_width  640
# initial_window_height 400

#: Se habilitado, o tamanho da Janela do SO será lembrado para que
#: novas instâncias do kitty tenham o mesmo tamanho que a instância
#: anterior. Se desabilitado, a Janela do SO terá inicialmente o
#: tamanho configurado por initial_window_width/height, em pixels.
#: Você pode usar um sufixo "c" nos valores de largura/altura para
#: interpretá-los como número de células em vez de pixels.

# enabled_layouts *

#: Os layouts de janela habilitados. Uma lista separada por vírgulas
#: de nomes de layout. O valor especial all significa todos os layouts.
#: O primeiro layout listado será usado como layout inicial.
#: Configuração padrão é todos os layouts em ordem alfabética. Para
#: uma lista de layouts disponíveis, veja os layouts
#: <https://sw.kovidgoyal.net/kitty/overview/#layouts>.

# window_resize_step_cells 2
# window_resize_step_lines 2

#: O tamanho do passo (em unidades de largura/altura da célula) a usar
#: ao redimensionar janelas do kitty em um layout com o atalho
#: start_resizing_window. O valor cells é usado para redimensionamento
#: horizontal, e o valor lines é usado para redimensionamento vertical.

# window_border_width 0.5pt

#: A largura das bordas das janelas. Pode ser em pixels (px) ou pontos
#: (pt). Valores em pontos serão arredondados para o número mais
#: próximo de pixels com base na resolução da tela. Se não
#: especificado, a unidade é assumida como pontos. Note que bordas são
#: exibidas apenas quando mais de uma janela está visível. Elas servem
#: para separar múltiplas janelas.

# draw_minimal_borders yes

#: Desenhar apenas as bordas mínimas necessárias. Isso significa que
#: apenas as bordas que separam a janela de uma vizinha são desenhadas.
#: Note que definir um window_margin_width não-zero substitui isso e
#: faz com que todas as bordas sejam desenhadas.

# window_margin_width 0

#: A margem da janela (em pontos) (área em branco fora da borda). Um
#: único valor define todos os quatro lados. Dois valores definem os
#: lados vertical e horizontal. Três valores definem superior,
#: horizontal e inferior. Quatro valores definem superior, direito,
#: inferior e esquerdo.

# single_window_margin_width -1

#: A margem da janela a usar quando apenas uma única janela está
#: visível (em pontos). Valores negativos farão com que o valor de
#: window_margin_width seja usado em vez disso. Um único valor define
#: todos os quatro lados. Dois valores definem os lados vertical e
#: horizontal. Três valores definem superior, horizontal e inferior.
#: Quatro valores definem superior, direito, inferior e esquerdo.

# window_padding_width 0

#: O preenchimento da janela (em pontos) (área em branco entre o texto
#: e a borda da janela). Um único valor define todos os quatro lados.
#: Dois valores definem os lados vertical e horizontal. Três valores
#: definem superior, horizontal e inferior. Quatro valores definem
#: superior, direito, inferior e esquerdo.

# single_window_padding_width -1

#: O preenchimento da janela a usar quando apenas uma única janela
#: está visível (em pontos). Valores negativos farão com que o valor
#: de window_padding_width seja usado em vez disso. Um único valor
#: define todos os quatro lados. Dois valores definem os lados
#: vertical e horizontal. Três valores definem superior, horizontal e
#: inferior. Quatro valores definem superior, direito, inferior e
#: esquerdo.

# placement_strategy center

#: Quando o tamanho da janela não é um múltiplo exato do tamanho da
#: célula, a área da célula da janela do terminal terá algum
#: preenchimento extra nas laterais. Você pode controlar como esse
#: preenchimento é distribuído com esta opção. Usar um valor de center
#: significa que a área da célula será colocada centralmente. Um valor
#: de top-left significa que o preenchimento estará apenas nas bordas
#: inferior e direita. O valor pode ser um de: top-left, top, top-right,
#: left, center, right, bottom-left, bottom, bottom-right.

# active_border_color #00ff00

#: A cor para a borda da janela ativa. Defina como none para não
#: desenhar bordas ao redor da janela ativa.

# inactive_border_color #cccccc

#: A cor para a borda de janelas inativas.

# bell_border_color #ff5a00

#: A cor para a borda de janelas inativas nas quais uma campainha
#: ocorreu.

# inactive_text_alpha 1.0

#: Desvanecer o texto em janelas inativas pela quantidade especificada
#: (um número entre zero e um, sendo zero totalmente desvanecido).

# hide_window_decorations no

#: Ocultar as decorações da janela (barra de título e bordas da
#: janela) com yes. No macOS, titlebar-only e titlebar-and-corners
#: podem ser usados para ocultar apenas a barra de título e os cantos
#: arredondados. Se isso funciona e exatamente qual efeito tem depende
#: do gerenciador de janelas/sistema operacional. Note que os efeitos
#: de alterar esta opção ao recarregar a configuração são indefinidos.
#: Ao usar titlebar-only, é útil também definir window_margin_width e
#: placement_strategy para evitar que os cantos arredondados cortem o
#: texto. Ou use titlebar-and-corners.

# window_logo_path none

#: Caminho para uma imagem de logotipo. Deve estar no formato
#: PNG/JPEG/WEBP/GIF/TIFF/BMP. Caminhos relativos são interpretados
#: relativos ao diretório de configuração do kitty. O logotipo é
#: exibido em um canto de cada janela do kitty. A posição é controlada
#: por window_logo_position. Janelas individuais podem ser configuradas
#: para ter logotipos diferentes, seja usando a ação launch ou a
#: facilidade de controle remoto
#: <https://sw.kovidgoyal.net/kitty/remote-control/>.

# window_logo_position bottom-right

#: Onde posicionar o logotipo da janela na janela. O valor pode ser um
#: de: top-left, top, top-right, left, center, right, bottom-left,
#: bottom, bottom-right.

# window_logo_alpha 0.5

#: A quantidade que o logotipo deve ser desvanecido no fundo. Sendo
#: zero totalmente desvanecido e um totalmente opaco.

# window_logo_scale 0

#: A porcentagem (0-100] do tamanho da janela para a qual o logotipo
#: deve ser escalado. Usar um único número significa que o logotipo é
#: escalado para essa porcentagem da dimensão mais curta da janela,
#: preservando a proporção da imagem do logotipo.

#: Usar dois números significa que a largura e a altura do logotipo
#: são escaladas para a respectiva porcentagem da largura e altura da
#: janela.

#: Usar zero como porcentagem desabilita o escalonamento nessa
#: dimensão. Um único zero (o padrão) desabilita todo o escalonamento
#: do logotipo da janela.

 resize_debounce_time 0.1 0.5

#: O tempo de espera (em segundos) antes de pedir ao programa em
#: execução no kitty para redimensionar e redesenhar a tela durante um
#: redimensionamento ao vivo da janela do SO, quando nenhum novo
#: evento de redimensionamento foi recebido, ou seja, quando o
#: redimensionamento está pausado ou terminado. Em plataformas como
#: macOS, onde o sistema operacional envia eventos correspondentes ao
#: início e fim de um redimensionamento ao vivo, o segundo número é
#: usado para redesenhar após pausa, já que o kitty pode distinguir
#: entre uma pausa e o fim do redimensionamento. Nesses sistemas, o
#: primeiro número é ignorado e o redesenho é imediato após o fim do
#: redimensionamento. Em outros sistemas, apenas o primeiro número é
#: usado para que o kitty esteja "pronto" rapidamente após o fim do
#: redimensionamento, sem também redesenhar continuamente, para
#: economizar energia.

# resize_in_steps no

#: Redimensionar a janela do SO em passos tão grandes quanto as
#: células, em vez de com a precisão usual de pixels. Combinado com
#: initial_window_width e initial_window_height em número de células,
#: esta opção pode ser usada para manter as margens o menor possível
#: ao redimensionar a janela do SO. Note que isso atualmente não
#: funciona no Wayland.

# visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ

#: A lista de caracteres para seleção visual de janela. Por exemplo,
#: para selecionar uma janela para focar com focus_visible_window. O
#: valor deve ser uma série de números ou alfabetos únicos, sem
#: distinção entre maiúsculas e minúsculas, do conjunto
#: 0-9A-Z\-=[];',./\\`. Especifique sua preferência como uma string de
#: caracteres.

# confirm_os_window_close -1

#: Pedir confirmação ao fechar uma janela do SO ou uma aba com pelo
#: menos este número de janelas do kitty nela pelo gerenciador de
#: janelas (por exemplo, clicando no botão de fechar da janela ou
#: pressionando o atalho do sistema operacional para fechar janelas)
#: ou pela ação close_tab. Um valor de zero desabilita a confirmação.
#: Esta confirmação também se aplica a pedidos para sair de todo o
#: aplicativo (todas as janelas do SO, via a ação quit). Valores
#: negativos são convertidos para positivos, no entanto, com
#: shell_integration habilitado, usar valores negativos significa que
#: janelas paradas em um prompt de shell não são contadas, apenas
#: janelas onde algum comando está atualmente em execução. Note que se
#: você quiser confirmação ao fechar janelas individuais, você pode
#: mapear a ação close_window_with_confirmation.

#: }}}

#: Barra de abas {{{

# tab_bar_edge bottom

#: A borda para mostrar a barra de abas, top ou bottom.

# tab_bar_margin_width 0.0

#: A margem à esquerda e à direita da barra de abas (em pontos).

# tab_bar_margin_height 0.0 0.0

#: A margem acima e abaixo da barra de abas (em pontos). O primeiro
#: número é a margem entre a borda da Janela do SO e a barra de abas.
#: O segundo número é a margem entre a barra de abas e o conteúdo da
#: aba atual.

# tab_bar_style fade

#: O estilo da barra de abas, pode ser um de:

#: fade
#:     As bordas de cada aba se desvanecem na cor de fundo. (Veja
#:     também tab_fade)
#: slant
#:     As abas parecem as abas em um arquivo físico.
#: separator
#:     As abas são separadas por um separador configurável. (Veja
#:     também tab_separator)
#: powerline
#:     As abas são mostradas como uma linha contínua com separadores
#:     "chiques". (Veja também tab_powerline_style)
#: custom
#:     Uma função Python fornecida pelo usuário chamada draw_tab é
#:     carregada do arquivo tab_bar.py no diretório de configuração do
#:     kitty. Para exemplos de como escrever tal função, veja as
#:     funções chamadas draw_tab_with_* no código-fonte do kitty:
#:     kitty/tab_bar.py. Veja também esta discussão
#:     <https://github.com/kovidgoyal/kitty/discussions/4447> para
#:     exemplos de usuários do kitty.
#: hidden
#:     A barra de abas é oculta. Se você usar isso, você pode querer
#:     criar um mapeamento para a ação select_tab que lhe apresenta
#:     uma lista de abas e permite alternar facilmente para uma aba.

# tab_bar_align left

#: O alinhamento horizontal da barra de abas, pode ser um de: left,
#: center, right.

# tab_bar_min_tabs 2

#: O número mínimo de abas que devem existir antes que a barra de
#: abas seja mostrada.

# tab_switch_strategy previous

#: O algoritmo a usar ao mudar para uma aba quando a aba atual é
#: fechada. O padrão previous mudará para a última aba usada. Um valor
#: de left mudará para a aba à esquerda da aba fechada. Um valor de
#: right mudará para a aba à direita da aba fechada. Um valor de last
#: mudará para a aba mais à direita.

# tab_fade 0.25 0.5 0.75 1

#: Controla como cada aba se desvanece no fundo ao usar fade para o
#: tab_bar_style. Cada número é um alfa (entre zero e um) que controla
#: quanto a célula correspondente se desvanece no fundo, sendo zero
#: nenhum desvanecimento e um desvanecimento total. Você pode alterar
#: o número de células usadas adicionando/removendo entradas a esta
#: lista.

# tab_separator " ┇"

#: O separador entre abas na barra de abas ao usar separator como o
#: tab_bar_style.

# tab_powerline_style angled

#: O estilo do separador powerline entre abas na barra de abas ao
#: usar powerline como o tab_bar_style, pode ser um de: angled,
#: slanted, round.

# tab_activity_symbol none

#: Algum texto ou um símbolo Unicode para mostrar na aba se uma janela
#: na aba que não tem foco tiver alguma atividade. Se você quiser usar
#: espaços à esquerda ou à direita, coloque o texto entre aspas. Veja
#: tab_title_template para como isso é renderizado.

# tab_title_max_length 0

#: O número máximo de células que podem ser usadas para renderizar o
#: texto em uma aba. Um valor de zero significa que nenhum limite é
#: aplicado.

# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title}"

#: Um template para renderizar o título da aba. O padrão apenas
#: renderiza o título com símbolos opcionais para campainha e
#: atividade. Se você deseja incluir o índice da aba também, use algo
#: como: {index}:{title}. Útil se você tem atalhos mapeados para
#: goto_tab N. Se você preferir ver o índice como sobrescrito, use
#: {sup.index}. Todos os dados disponíveis são:

#: title
#:     O título atual da aba.
#: index
#:     O índice da aba utilizável com atalhos goto_tab N goto_tab.
#: layout_name
#:     O nome do layout atual.
#: num_windows
#:     O número de janelas na aba.
#: num_window_groups
#:     O número de grupos de janelas (um grupo de janelas é uma janela e
#:     todas as suas janelas sobrepostas) na aba.
#: tab.active_wd
#:     O diretório de trabalho da janela atualmente ativa na aba
#:     (caro, requer chamada de sistema). Use active_oldest_wd para
#:     obter o diretório do processo em primeiro plano mais antigo em
#:     vez do mais novo.
#: tab.active_exe
#:     O nome do executável em execução em primeiro plano da janela
#:     atualmente ativa na aba (caro, requer chamada de sistema). Use
#:     active_oldest_exe para o processo em primeiro plano mais antigo.
#: max_title_length
#:     O comprimento máximo de título disponível.
#: keyboard_mode
#:     O nome do modo de teclado atual
#:     <https://sw.kovidgoyal.net/kitty/mapping/#modal-mappings> ou a
#:     string vazia se nenhum modo de teclado estiver ativo.

#: Note que a formatação é feita pela maquinaria de formatação de
#: string do Python, então você pode usar, por exemplo,
#: {layout_name[:2].upper()} para mostrar apenas as duas primeiras
#: letras do nome do layout, em maiúsculas. Se você quiser estilizar o
#: texto, você pode usar diretivas de estilo, por exemplo:
#: `{fmt.fg.red}vermelho{fmt.fg.tab}normal{fmt.bg._00FF00}fundoverde{fmt.bg.tab}`.
#: Similarmente, para negrito e itálico:
#: `{fmt.bold}negrito{fmt.nobold}normal{fmt.italic}itálico{fmt.noitalic}`.
#: As 256 cores de terminal podem ser usadas como `fmt.fg.color0`
#: até `fmt.fg.color255`. Note que para compatibilidade com versões
#: anteriores, se {bell_symbol} ou {activity_symbol} não estiverem
#: presentes no template, eles são prefixados a ele.

# active_tab_title_template none

#: Template a usar para abas ativas. Se não especificado, recorre a
#: tab_title_template.

# active_tab_foreground   #000
# active_tab_background   #eee
# active_tab_font_style   bold-italic
# inactive_tab_foreground #444
# inactive_tab_background #999
# inactive_tab_font_style normal

#: Cores e estilos da barra de abas.

# tab_bar_background none

#: Cor de fundo para a barra de abas. O padrão é usar a cor de fundo
#: do terminal.

# tab_bar_margin_color none

#: Cor para a área de margem da barra de abas. O padrão é usar a cor
#: de fundo do terminal para margens acima e abaixo da barra de abas.
#: Para margens laterais, a cor padrão é escolhida para corresponder à
#: cor de fundo da aba vizinha.

#: }}}

#: Esquema de cores {{{

# foreground #dddddd
# background #000000

#: As cores de primeiro plano e fundo.

# background_opacity 1.0

#: A opacidade do fundo. Um número entre zero e um, onde um é opaco e
#: zero é totalmente transparente. Isso só funcionará se suportado
#: pelo SO (por exemplo, ao usar um compositor sob X11). Note que
#: define apenas a opacidade da cor de fundo em células que têm a
#: mesma cor de fundo que o fundo padrão do terminal, para que coisas
#: como a barra de status no vim, prompts do powerline, etc. ainda
#: pareçam boas. Mas significa que se você usar um tema de cores com
#: uma cor de fundo no seu editor, ele não será renderizado como
#: transparente. Em vez disso, você deve alterar a cor de fundo padrão
#: na sua configuração do kitty e não usar uma cor de fundo no esquema
#: de cores do editor. Ou use os códigos de escape para definir as
#: cores padrão do terminal em um script de shell para iniciar seu
#: editor. Veja também transparent_background_colors. Esteja ciente de
#: que usar um valor menor que 1.0 é um impacto de desempenho
#: (possivelmente significativo). Ao usar um valor baixo para esta
#: configuração, é desejável que você defina a cor de fundo para uma
#: cor que corresponda à cor geral do fundo da área de trabalho, para
#: melhor renderização de texto. Se você quiser alterar dinamicamente
#: a transparência das janelas, defina dynamic_background_opacity como
#: yes (isso está desativado por padrão, pois tem um custo de
#: desempenho). Alterar esta opção ao recarregar a configuração só
#: funcionará se dynamic_background_opacity foi habilitado na
#: configuração original.

# background_blur 0

#: Defina como um valor positivo para habilitar o desfoque de fundo
#: (desfoque dos visuais atrás de uma janela transparente) em
#: plataformas que suportam. Só tem efeito quando background_opacity
#: é menor que um. No macOS, isso também controlará o raio de desfoque
#: (quantidade de desfoque). Definir para um valor muito alto causará
#: problemas severos de desempenho e/ou artefatos de renderização.
#: Normalmente, valores até 64 funcionam bem. Note que isso pode
#: causar problemas de desempenho, dependendo de como a plataforma
#: implementa, então use com cuidado. Atualmente suportado no macOS e
#: KDE.

# background_image none

#: Caminho para uma imagem de fundo. Deve estar no formato
#: PNG/JPEG/WEBP/TIFF/GIF/BMP.

# background_image_layout tiled

#: Se deve ladrilhar, escalar ou fixar a imagem de fundo. O valor pode
#: ser um de tiled, mirror-tiled, scaled, clamped, centered ou
#: cscaled. Os valores scaled e cscaled escalam a imagem para o
#: tamanho da janela, com cscaled preservando a proporção da imagem.

# background_image_linear no

#: Quando a imagem de fundo é escalada, se a interpolação linear deve
#: ser usada.

# transparent_background_colors

#: Uma lista separada por espaço de até 7 cores, com opacidade. Quando
#: a cor de fundo de uma célula corresponde a uma dessas cores, ela é
#: renderizada semitransparente usando a opacidade especificada.

#: Útil em UIs mais complexas como editores, onde você pode querer mais
#: de uma única cor de fundo renderizada como transparente, por
#: exemplo, para o fundo de uma linha de destaque do cursor ou um
#: bloco destacado. Aplicativos de terminal podem definir essa cor
#: usando o controle de cor do kitty
#: <https://sw.kovidgoyal.net/kitty/color-stack/#color-control> código
#: de escape.

#: A sintaxe para especificar cores é: color@opacity, onde a parte
#: @opacity é opcional. Quando não especificada, o valor de
#: background_opacity é usado. Por exemplo::

#:     transparent_background_colors red@0.5 #00ff00@0.3

# dynamic_background_opacity no

#: Permitir alteração da background_opacity dinamicamente, usando
#: atalhos de teclado (increase_background_opacity e
#: decrease_background_opacity) ou a facilidade de controle remoto.
#: Alterar esta opção recarregando a configuração não é suportado.

# background_tint 0.0

#: Quanto tingir a imagem de fundo com a cor de fundo. Esta opção
#: facilita a leitura do texto. A tingimento é feito usando a cor de
#: fundo atual para cada janela. Esta opção se aplica apenas se
#: background_opacity estiver definido e janelas transparentes forem
#: suportadas ou background_image estiver definido.

# background_tint_gaps 1.0

#: Quanto tingir a imagem de fundo nos espaços da janela com a cor de
#: fundo, após aplicar background_tint. Como isso é multiplicativo com
#: background_tint, pode ser usado para clarear o tingimento sobre os
#: espaços da janela para um visual *separado*.

# dim_opacity 0.4

#: Quanto escurecer o texto que tem o atributo DIM/FAINT definido. Um
#: significa sem escurecimento e zero significa totalmente escurecido
#: (ou seja, invisível).

# selection_foreground #000000
# selection_background #fffacd

#: As cores de primeiro plano e fundo para texto selecionado com o
#: mouse. Definir ambos como none causará um efeito de "vídeo
#: reverso" para seleções, onde a seleção será a cor do texto da
#: célula e o texto se tornará a cor de fundo da célula. Definir
#: apenas selection_foreground como none fará com que a cor de
#: primeiro plano seja usada sem alterações. Note que essas cores
#: podem ser substituídas pelo programa em execução no terminal.

#: A tabela de cores {{{

#: As 256 cores do terminal. Existem 8 cores básicas, cada cor tem
#: uma versão opaca e uma brilhante, para as primeiras 16 cores. Você
#: pode definir as 240 cores restantes como color16 a color255.

# color0 #000000
# color8 #767676

#: preto

# color1 #cc0403
# color9 #f2201f

#: vermelho

# color2  #19cb00
# color10 #23fd00

#: verde

# color3  #cecb00
# color11 #fffd00

#: amarelo

# color4  #0d73cc
# color12 #1a8fff

#: azul

# color5  #cb1ed1
# color13 #fd28ff

#: magenta

# color6  #0dcdcd
# color14 #14ffff

#: ciano

# color7  #dddddd
# color15 #ffffff

#: branco

# mark1_foreground black

#: Cor para marcas do tipo 1

# mark1_background #98d3cb

#: Cor para marcas do tipo 1 (azul aço claro)

# mark2_foreground black

#: Cor para marcas do tipo 2

# mark2_background #f2dcd3

#: Cor para marcas do tipo 1 (bege)

# mark3_foreground black

#: Cor para marcas do tipo 3

# mark3_background #f274bc

#: Cor para marcas do tipo 3 (violeta)

#: }}}

#: }}}

#: Avançado {{{

# shell .

#: O programa shell a executar. O valor padrão de . significa usar o
#: valor da variável de ambiente SHELL ou, se não definida, qualquer
#: shell que esteja definido como o shell padrão para o usuário atual.
#: Note que no macOS, se você alterar isso, pode precisar adicionar
#: --login e --interactive para garantir que o shell inicie em modo
#: interativo e leia seus arquivos rc de inicialização. Variáveis de
#: ambiente são expandidas nesta configuração.

# editor .

#: O editor de texto baseado em terminal (como vim ou nano) a usar ao
#: editar o arquivo de configuração do kitty ou tarefas similares.

#: O valor padrão de . significa usar as variáveis de ambiente VISUAL
#: e EDITOR nessa ordem. Se essas variáveis não estiverem definidas, o
#: kitty executará seu shell ($SHELL -l -i -c env) para ver se seus
#: arquivos rc de inicialização do shell definem VISUAL ou EDITOR. Se
#: isso não funcionar, o kitty percorrerá vários editores conhecidos
#: (vim, emacs, etc.) e pegará o primeiro que existir no seu sistema.

# close_on_child_death no

#: Fechar a janela quando o processo filho (geralmente o shell) sair.
#: Com o valor padrão no, o terminal permanecerá aberto quando o filho
#: sair, desde que ainda haja outros processos enviando saída para o
#: terminal (por exemplo, processos desvinculados ou em segundo plano).
#: Quando habilitado com yes, a janela fechará assim que o processo
#: filho sair. Note que defini-lo como yes significa que quaisquer
#: processos em segundo plano ainda usando o terminal podem falhar
#: silenciosamente porque seu stdout/stderr/stdin não funcionam mais.

# remote_control_password

#: Permitir que outros programas controlem o kitty usando senhas.
#: Esta opção pode ser especificada múltiplas vezes para adicionar
#: múltiplas senhas. Se nenhuma senha estiver presente, o kitty pedirá
#: permissão ao usuário se um programa tentar usar controle remoto com
#: uma senha. Uma senha pode *opcionalmente* ser associada a um
#: conjunto de ações de controle remoto permitidas. Por exemplo::

#:     remote_control_password "minha frase secreta" get-colors set-colors focus-window focus-tab

#: Apenas as ações especificadas serão permitidas ao usar esta senha.
#: Padrões glob também podem ser usados, por exemplo::

#:     remote_control_password "minha frase secreta" set-tab-* resize-*

#: Para obter uma lista de ações disponíveis, execute::

#:     kitten @ --help

#: Um conjunto de ações a serem permitidas quando nenhuma senha é
#: enviada pode ser especificado usando uma senha vazia. Por exemplo::

#:     remote_control_password "" *-colors

#: Finalmente, o caminho para um módulo Python pode ser especificado
#: que fornece uma função is_cmd_allowed que é usada para verificar
#: cada comando de controle remoto. Por exemplo::

#:     remote_control_password "minha frase secreta" my_rc_command_checker.py

#: Caminhos relativos são resolvidos a partir do diretório de
#: configuração do kitty. Veja rc_custom_auth
#: <https://sw.kovidgoyal.net/kitty/remote-control/#rc-custom-auth>
#: para detalhes.

# allow_remote_control no

#: Permitir que outros programas controlem o kitty. Se você ativar
#: isso, outros programas podem controlar todos os aspectos do kitty,
#: incluindo enviar texto para janelas do kitty, abrir novas janelas,
#: fechar janelas, ler o conteúdo das janelas, etc. Note que isso
#: funciona até mesmo em conexões SSH. A configuração padrão no impede
#: qualquer forma de controle remoto. O significado dos vários valores
#: é:

#: password
#:     Pedidos de controle remoto recebidos tanto pelo dispositivo TTY
#:     quanto pelo socket são confirmados com base em senhas, veja
#:     remote_control_password.

#: socket-only
#:     Pedidos de controle remoto recebidos por um socket são aceitos
#:     incondicionalmente. Pedidos recebidos pelo TTY são negados.
#:     Veja listen_on.

#: socket
#:     Pedidos de controle remoto recebidos por um socket são aceitos
#:     incondicionalmente. Pedidos recebidos pelo TTY são confirmados
#:     com base em senha.

#: no
#:     O controle remoto está completamente desabilitado.

#: yes
#:     Pedidos de controle remoto são sempre aceitos.

# listen_on none

#: Escutar no socket especificado para conexões de controle remoto.
#: Note que isso se aplicará a todas as instâncias do kitty. Pode ser
#: substituído pela opção de linha de comando kitty --listen-on. Para
#: sockets UNIX, como unix:${TEMP}/mykitty ou unix:@mykitty (no
#: Linux). Variáveis de ambiente são expandidas e caminhos relativos
#: são resolvidos em relação ao diretório temporário. Se {kitty_pid}
#: estiver presente, então é substituído pelo PID do processo do kitty,
#: caso contrário o PID do processo do kitty é anexado ao valor, com
#: um hífen. Para sockets TCP como tcp:localhost:0 uma porta aleatória
#: é sempre usada, mesmo se um número de porta não-zero for
#: especificado. Veja a ajuda para kitty --listen-on para mais
#: detalhes. Note que isso será ignorado a menos que
#: allow_remote_control esteja definido como: yes, socket ou
#: socket-only. Alterar esta opção recarregando a configuração não é
#: suportado.

# env

#: Especificar as variáveis de ambiente a serem definidas em todos os
#: processos filhos. Usar o nome com um sinal de igual (por exemplo,
#: env VAR=) irá defini-lo como a string vazia. Especificar apenas o
#: nome (por exemplo, env VAR) removerá a variável do ambiente do
#: processo filho. Note que variáveis de ambiente são expandidas
#: recursivamente, por exemplo::

#:     env VAR1=a
#:     env VAR2=${HOME}/${VAR1}/b

#: O valor de VAR2 será <caminho para o diretório home>/a/b.

# filter_notification

#: Especificar regras para filtrar notificações enviadas por
#: aplicativos em execução no kitty. Pode ser especificado múltiplas
#: vezes para criar múltiplas regras de filtro. Uma especificação de
#: regra é da forma field:regexp. Uma regra de filtro pode
#: corresponder a qualquer um dos campos: title, body, app, type. O
#: valor especial all filtra todas as notificações. Regras podem ser
#: combinadas usando operadores booleanos. Alguns exemplos::

#:     filter_notification title:hello or body:"abc.*def"
#:     # filtrar notificação do vim exceto por aquelas sobre
#:     atualizações, (?i) torna a correspondência sem distinção entre
#:     maiúsculas e minúsculas.
#:     filter_notification app:"[ng]?vim" and not body:"(?i)update"
#:     # filtrar todas as notificações
#:     filter_notification all

#: O campo app é o nome do aplicativo que envia a notificação e type
#: é o tipo da notificação. Nem todos os aplicativos enviarão esses
#: campos, então você também pode corresponder ao título e corpo do
#: texto da notificação. Filtragem programática mais sofisticada e
#: ações personalizadas em notificações podem ser feitas criando um
#: arquivo notifications.py no diretório de configuração do kitty
#: (~/.config/kitty). Um exemplo anotado está disponível
#: <https://github.com/kovidgoyal/kitty/blob/master/docs/notifications.py>.

# watcher

#: Caminho para arquivo python que será carregado para watchers
#: <https://sw.kovidgoyal.net/kitty/launch/#watchers>. Pode ser
#: especificado mais de uma vez para carregar múltiplos watchers. Os
#: watchers serão adicionados a cada janela do kitty. Caminhos
#: relativos são resolvidos em relação ao diretório de configuração do
#: kitty. Note que recarregar a configuração afetará apenas janelas
#: criadas após o recarregamento.

# exe_search_path

#: Controlar onde o kitty encontra os programas a executar. A ordem de
#: pesquisa padrão é: Primeiro pesquisar o PATH do sistema, depois
#: ~/.local/bin e ~/bin. Se ainda não encontrado, o PATH definido no
#: shell de login após carregar todos os seus arquivos de
#: inicialização é tentado. Finalmente, se presente, o PATH
#: especificado pela opção env é tentado.

#: Esta opção permite que você prefixe, sufixe ou remova caminhos
#: desta ordem de pesquisa. Pode ser especificada múltiplas vezes para
#: múltiplos caminhos. Um caminho simples será prefixado à ordem de
#: pesquisa. Um caminho que começa com o sinal + será sufixado à ordem
#: de pesquisa, depois de ~/bin acima. Um caminho que começa com o
#: sinal - será removido de toda a ordem de pesquisa. Por exemplo::

#:     exe_search_path /algum/caminho/prefixado
#:     exe_search_path +/algum/caminho/sufixado
#:     exe_search_path -/algum/caminho/excluido

# update_check_interval 24

#: O intervalo para verificar periodicamente se uma atualização do
#: kitty está disponível (em horas). Se uma atualização for
#: encontrada, uma notificação do sistema é exibida informando você
#: sobre a atualização disponível. O padrão é verificar a cada 24
#: horas, defina como zero para desabilitar. A verificação de
#: atualização é feita apenas pelas compilações binárias oficiais.
#: Pacotes de distro ou compilações de fonte não fazem verificação de
#: atualização. Alterar esta opção recarregando a configuração não é
#: suportado.

# startup_session none

#: Caminho para um arquivo de sessão a usar para todas as instâncias
#: do kitty. Pode ser substituído usando a opção de linha de comando
#: kitty --session =none para instâncias individuais. Veja sessões
#: <https://sw.kovidgoyal.net/kitty/overview/#sessions> na
#: documentação do kitty para detalhes. Note que caminhos relativos
#: são interpretados em relação ao diretório de configuração do kitty.
#: Variáveis de ambiente no caminho são expandidas. Alterar esta opção
#: recarregando a configuração não é suportado. Note que se o kitty for
#: invocado com argumentos de linha de comando especificando um
#: comando a executar, esta opção é ignorada.

# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

#: Permitir que programas em execução no kitty leiam e escrevam na
#: área de transferência. Você pode controlar exatamente quais ações
#: são permitidas. As ações possíveis são: write-clipboard,
#: read-clipboard, write-primary, read-primary, read-clipboard-ask,
#: read-primary-ask. O padrão é permitir escrever na área de
#: transferência e seleção primária e pedir permissão quando um
#: programa tenta ler da área de transferência. Note que desabilitar a
#: confirmação de leitura é um risco de segurança, pois significa que
#: qualquer programa, mesmo os executados em um servidor remoto via
#: SSH, pode ler sua área de transferência. Veja também
#: clipboard_max_size.

# clipboard_max_size 512

#: O tamanho máximo (em MB) de dados de programas em execução no kitty
#: que serão armazenados para escrever na área de transferência do
#: sistema. Um valor de zero significa que nenhum limite de tamanho é
#: aplicado. Veja também clipboard_control.

# file_transfer_confirmation_bypass

#: A senha que pode ser fornecida ao kitten de transferência de
#: arquivos <https://sw.kovidgoyal.net/kitty/kittens/transfer/> para
#: pular o prompt de confirmação de transferência. Isso só deve ser
#: usado ao iniciar transferências de computadores confiáveis, em
#: redes confiáveis ou transportes criptografados, pois permite que
#: quaisquer programas em execução na máquina remota leiam/escrevam no
#: sistema de arquivos local, sem permissão.

# allow_hyperlinks yes

#: Processar sequências de escape de hyperlink (OSC 8). Se
#: desabilitado, sequências de escape OSC 8 são ignoradas. Caso
#: contrário, elas se tornam links clicáveis, que você pode clicar com
#: o mouse ou usando o kitten hints
#: <https://sw.kovidgoyal.net/kitty/kittens/hints/>. O valor especial
#: ask significa que o kitty perguntará antes de abrir o link quando
#: clicado.

# shell_integration enabled

#: Habilitar integração de shell em shells suportados. Isso habilita
#: recursos como pular para prompts anteriores, navegar na saída do
#: comando anterior em um pager, etc. em shells suportados. Defina
#: como disabled para desligar a integração de shell completamente.
#: Também é possível desabilitar recursos individuais, definindo como
#: uma lista separada por espaço destes valores: no-rc, no-cursor,
#: no-title, no-cwd, no-prompt-mark, no-complete, no-sudo. Veja
#: Integração de Shell
#: <https://sw.kovidgoyal.net/kitty/shell-integration/> para detalhes.

# allow_cloning ask

#: Controlar se programas em execução no terminal podem solicitar
#: novas janelas a serem criadas. O exemplo canônico é
#: clone-in-kitty
#: <https://sw.kovidgoyal.net/kitty/shell-integration/#clone-shell>.
#: Por padrão, o kitty pedirá permissão para cada pedido de clone.
#: Permitir clonagem incondicionalmente dá a programas em execução no
#: terminal (incluindo via SSH) permissão para executar código
#: arbitrário, como o usuário que está executando o terminal, no
#: computador no qual o terminal está sendo executado.

# clone_source_strategies venv,conda,env_var,path

#: Controlar qual código de shell é carregado ao executar
#: clone-in-kitty na janela recém-clonada. As estratégias suportadas
#: são:

#: venv
#:     Carregar o arquivo $VIRTUAL_ENV/bin/activate. Isso é usado pelo
#:     módulo venv da stdlib do Python e permite clonar venvs
#:     automaticamente.
#: conda
#:     Executar conda activate $CONDA_DEFAULT_ENV. Isso suporta os
#:     ambientes virtuais criados pelo conda.
#: env_var
#:     Executar o conteúdo da variável de ambiente
#:     KITTY_CLONE_SOURCE_CODE com eval.
#: path
#:     Carregar o arquivo apontado pela variável de ambiente
#:     KITTY_CLONE_SOURCE_PATH.

#: Esta opção deve ser uma lista separada por vírgulas dos valores
#: acima. Apenas a primeira correspondência válida, na ordem
#: especificada, é carregada.

# notify_on_cmd_finish never

#: Mostrar uma notificação de desktop quando um comando de longa
#: duração terminar (precisa de shell_integration). Os valores
#: possíveis são:

#: never
#:     Nunca enviar uma notificação.

#: unfocused
#:     Só enviar uma notificação quando a janela não tiver foco de
#:     teclado.

#: invisible
#:     Só enviar uma notificação quando a janela estiver sem foco e não
#:     visível para o usuário, por exemplo, porque está em uma aba
#:     inativa ou sua janela do SO não está atualmente ativa.

#: always
#:     Sempre enviar uma notificação, independentemente do estado da
#:     janela.

#: Existem dois argumentos opcionais:

#: Primeiro, a duração mínima para o que é considerado um comando de
#: longa duração. O padrão é 5 segundos. Especifique um segundo
#: argumento para definir a duração. Por exemplo: invisible 15. Não
#: defina o valor muito pequeno, caso contrário um comando que inicia
#: uma nova Janela do SO e sai enviará spam de notificação.

#: Segundo, a ação a executar. O padrão é notify. Os valores possíveis
#: são:

#: notify
#:     Enviar uma notificação de desktop.

#: bell
#:     Tocar a campainha do terminal.

#: command
#:     Executar um comando personalizado. Todos os argumentos
#:     subsequentes são a linha de comando a executar.

#: Mais alguns exemplos::

#:     # Enviar uma notificação quando um comando leva mais de 5 segundos em uma janela sem foco
#:     notify_on_cmd_finish unfocused
#:     # Enviar uma notificação quando um comando leva mais de 10 segundos em uma janela invisível
#:     notify_on_cmd_finish invisible 10.0
#:     # Tocar uma campainha quando um comando leva mais de 10 segundos em uma janela invisível
#:     notify_on_cmd_finish invisible 10.0 bell
#:     # Executar 'notify-send' quando um comando leva mais de 10 segundos em uma janela invisível
#:     # Aqui %c é substituído pela linha de comando atual e %s pelo código de saída do trabalho
#:     notify_on_cmd_finish invisible 10.0 command notify-send "trabalho terminou com status: %s" %c

# term xterm-kitty

#: O valor da variável de ambiente TERM a definir. Alterar isso pode
#: quebrar muitos programas de terminal, só altere se você souber o
#: que está fazendo, não porque você leu algum conselho no "Stack
#: Overflow" para alterá-lo. A variável TERM é usada por vários
#: programas para obter informações sobre as capacidades e
#: comportamento do terminal. Se você alterá-la, dependendo de quais
#: programas você executa, e quão diferente o terminal para o qual
#: você está mudando é, várias coisas, desde pressionamentos de tecla,
#: até cores, até vários recursos avançados podem não funcionar.
#: Alterar esta opção recarregando a configuração afetará apenas
#: janelas recém-criadas.

# terminfo_type path

#: O valor da variável de ambiente TERMINFO a definir. Esta variável é
#: usada por programas em execução no terminal para pesquisar bancos
#: de dados terminfo. O valor padrão path faz com que o kitty o defina
#: para um local no sistema de arquivos contendo o banco de dados
#: terminfo do kitty. Um valor de direct coloca todo o banco de dados
#: diretamente na variável de ambiente. Isso pode ser útil ao conectar
#: a contêineres, por exemplo. Mas note que nem todo software suporta
#: isso. Um valor de none significa não tocar na variável.

# forward_stdio no

#: Encaminhar STDOUT e STDERR do processo do kitty para processos
#: filhos. Isso é útil para depuração, pois permite que processos
#: filhos imprimam no STDOUT do kitty diretamente. Por exemplo,
#: echo hello world >&$KITTY_STDIO_FORWARDED em um shell imprimirá no
#: STDOUT do kitty pai. Define a variável de ambiente
#: KITTY_STDIO_FORWARDED=fdnum para que processos filhos saibam sobre
#: o encaminhamento. Note que no macOS isso impede que o shell seja
#: executado via o utilitário login, então getlogin() não funcionará
#: em programas executados nesta sessão.

# menu_map

#: Especificar entradas para vários menus no kitty. Atualmente apenas
#: a barra de menus global no macOS é suportada. Por exemplo::

#:    menu_map global "Actions::Launch something special" launch --hold --type=os-window sh -c "echo hello world"

#: Isso criará uma entrada de menu chamada "Launch something special"
#: em um menu "Actions" na barra de menus global do macOS. Submenus
#: podem ser criados adicionando mais níveis separados pelos
#: caracteres ::.

#: }}}

#: Ajustes específicos do SO {{{

# wayland_titlebar_color system

#: A cor da barra de título da janela do kitty em sistemas Wayland com
#: decorações de janela do lado do cliente, como GNOME. Um valor de
#: system significa usar as cores padrão do sistema, um valor de
#: background significa usar a cor de fundo da janela ativa do kitty
#: e, finalmente, você pode usar uma cor arbitrária, como #12af59 ou
#: red.

# macos_titlebar_color system

#: A cor da barra de título da janela do kitty no macOS. Um valor de
#: system significa usar a cor padrão do sistema, light ou dark também
#: podem ser usados para defini-lo explicitamente. Um valor de
#: background significa usar a cor de fundo da janela ativa e,
#: finalmente, você pode usar uma cor arbitrária, como #12af59 ou red.
#: AVISO: Esta opção funciona usando um hack quando uma cor arbitrária
#: (ou background) é configurada, pois não há API Cocoa adequada para
#: isso. Ela define a cor de fundo de toda a janela e torna a barra de
#: título transparente. Como tal, é incompatível com
#: background_opacity. Se você quiser usar ambos, você provavelmente
#: está melhor apenas ocultando a barra de título com
#: hide_window_decorations.

# macos_option_as_alt no

#: Usar a tecla Option como uma tecla Alt no macOS. Com isso definido
#: como no, o kitty usará o comportamento nativo do macOS Option+Tecla
#: para inserir caracteres Unicode. Isso quebrará quaisquer atalhos de
#: teclado Alt+Tecla em seus programas de terminal, mas você pode usar
#: a técnica de entrada Unicode do macOS. Você pode usar os valores:
#: left, right ou both para usar apenas as teclas Option esquerda,
#: direita ou ambas como Alt, em vez disso. Note que o kitty em si
#: sempre trata Option da mesma forma que Alt. Isso significa que você
#: não pode usar esta opção para configurar atalhos diferentes do
#: kitty para Option+Tecla vs. Alt+Tecla. Além disso, quaisquer
#: atalhos do kitty usando Option/Alt+Tecla terão prioridade, de modo
#: que quaisquer tais pressionamentos de tecla não serão passados para
#: programas de terminal em execução dentro do kitty. Alterar esta
#: opção recarregando a configuração não é suportado.

# macos_hide_from_tasks no

#: Ocultar a janela do kitty de tarefas em execução no macOS (⌘+Tab e
#: o Dock). Alterar esta opção recarregando a configuração não é
#: suportado.

# macos_quit_when_last_window_closed no

#: Fazer o kitty sair quando todas as janelas de nível superior forem
#: fechadas no macOS. Por padrão, o kitty permanecerá em execução,
#: mesmo sem janelas abertas, como é o comportamento esperado no
#: macOS.

# macos_window_resizable yes

#: Desabilite isso se você quiser que as janelas do SO de nível
#: superior do kitty não sejam redimensionáveis no macOS.

# macos_thicken_font 0

#: Desenhar uma borda extra ao redor da fonte com a largura dada, para
#: aumentar a legibilidade em tamanhos de fonte pequenos no macOS. Por
#: exemplo, um valor de 0.75 resultará em renderização que se parece
#: com antialiasing subpixel em tamanhos de fonte comuns. Note que no
#: kitty moderno, esta opção está obsoleta (embora ainda suportada).
#: Considere usar text_composition_strategy em vez disso.

# macos_traditional_fullscreen no

#: Usar a transição de tela cheia tradicional do macOS, que é mais
#: rápida, mas menos bonita.

# macos_show_window_title_in all

#: Controlar onde o título da janela é exibido no macOS. Um valor de
#: window mostrará o título da janela ativa no topo da janela do
#: macOS. Um valor de menubar mostrará o título da janela ativa na
#: barra de menus global do macOS, fazendo uso de espaço de outra forma
#: desperdiçado. Um valor de all mostrará o título em ambos os
#: lugares, e none oculta o título. Veja
#: macos_menubar_title_max_length para como controlar o comprimento do
#: título na barra de menus.

# macos_menubar_title_max_length 0

#: O número máximo de caracteres do título da janela a mostrar na
#: barra de menus global do macOS. Valores menores que um significam
#: que não há limite máximo.

# macos_custom_beam_cursor no

#: Usar um cursor de mouse personalizado para macOS que é mais fácil
#: de ver em fundos claros e escuros. Hoje em dia, o cursor padrão do
#: macOS já vem com uma borda branca. AVISO: isso pode tornar seu
#: cursor do mouse invisível em máquinas com GPU dupla. Alterar esta
#: opção recarregando a configuração não é suportado.

# macos_colorspace srgb

#: O espaço de cores no qual interpretar as cores do terminal. O
#: padrão de srgb fará com que as cores correspondam às vistas em
#: navegadores web. O valor de default usará qualquer que seja o
#: espaço de cores nativo do monitor. O valor de displayp3 usará o
#: espaço de cores especial display P3 da Apple, o que resultará em
#: cores sobressaturadas (mais brilhantes) com algum desvio de cor.
#: Recarregar a configuração mudará este valor apenas para janelas do
#: SO recém-criadas.

# linux_display_server auto

#: Escolher entre backends Wayland e X11. Por padrão, um backend
#: apropriado com base no estado do sistema é escolhido
#: automaticamente. Defina como x11 ou wayland para forçar a escolha.
#: Alterar esta opção recarregando a configuração não é suportado.

# wayland_enable_ime yes

#: Habilitar Input Method Extension no Wayland. Isso é tipicamente
#: usado para inserir texto em idiomas do Leste Asiático. No entanto,
#: sua implementação no Wayland é frequentemente bugada e introduz
#: latência no loop de entrada, então desabilite isso se você sabe que
#: não precisa. Alterar esta opção recarregando a configuração não é
#: suportado, não terá nenhum efeito.

#: }}}

#: Atalhos de teclado {{{

#: As teclas são identificadas simplesmente por seus caracteres
#: Unicode minúsculos. Por exemplo: a para a tecla A, [ para a tecla
#: colchete esquerdo, etc. Para teclas funcionais, como Enter ou
#: Escape, os nomes estão presentes em Definições de teclas funcionais
#: <https://sw.kovidgoyal.net/kitty/keyboard-protocol/#functional>.
#: Para teclas modificadoras, os nomes são ctrl (control, ⌃), shift
#: (⇧), alt (opt, option, ⌥), super (cmd, command, ⌘).

#: O mapeamento simples de atalhos é feito com a diretiva map. Para
#: detalhes completos sobre mapeamento avançado, incluindo mapeamento
#: modal e por aplicativo, veja mapeamento
#: <https://sw.kovidgoyal.net/kitty/mapping/>. Alguns exemplos rápidos
#: para ilustrar tarefas comuns::

#:     # desmapear um atalho de teclado, passando-o para o programa em execução no kitty
#:     map kitty_mod+space
#:     # ignorar completamente um evento de teclado
#:     map ctrl+alt+f1 discard_event
#:     # combinar múltiplas ações
#:     map kitty_mod+e combine : new_window : next_layout
#:     # atalhos de múltiplas teclas
#:     map ctrl+x>ctrl+y>z action

#: A lista completa de ações que podem ser mapeadas para
#: pressionamentos de tecla está disponível aqui
#: <https://sw.kovidgoyal.net/kitty/actions/>.

# kitty_mod ctrl+shift

#: Alias de tecla modificadora especial para atalhos padrão. Você pode
#: alterar o valor desta opção para alterar todos os atalhos padrão
#: que usam kitty_mod.

# clear_all_shortcuts no

#: Remover todas as definições de atalho até este ponto. Útil, por
#: exemplo, para remover os atalhos padrão.

# action_alias

#: Ex.: action_alias launch_tab launch --type=tab --cwd=current

#: Definir aliases de ação para evitar repetir as mesmas opções em
#: múltiplos mapeamentos. Aliases podem ser definidos para qualquer
#: ação e serão expandidos recursivamente. Por exemplo, o alias acima
#: permite que você crie mapeamentos para iniciar uma nova aba no
#: diretório de trabalho atual sem duplicação::

#:     map f1 launch_tab vim
#:     map f2 launch_tab emacs

#: Similarmente, para alias de invocação de kitten::

#:     action_alias hints kitten hints --hints-offset=0

# kitten_alias

#: Ex.: kitten_alias hints hints --hints-offset=0

#: Como action_alias acima, mas especificamente para kittens.
#: Geralmente, prefira usar action_alias. Esta opção é uma versão
#: legada, presente para compatibilidade com versões anteriores. Ela
#: faz com que todas as invocações do kitten aliasado sejam
#: substituídas. Então o exemplo acima fará com que todas as invocações
#: do kitten hints tenham a opção --hints-offset=0 aplicada.

#: Área de transferência {{{

#: Copiar para a área de transferência

# map kitty_mod+c copy_to_clipboard
# map cmd+c       copy_to_clipboard

#::  Há também uma ação copy_or_interrupt que pode ser opcionalmente
#::  mapeada para Ctrl+C. Ela copiará apenas se houver uma seleção e
#::  enviará uma interrupção caso contrário. Similarmente,
#::  copy_and_clear_or_interrupt copiará e limpará a seleção ou
#::  enviará uma interrupção se não houver seleção.

#: Colar da área de transferência

# map kitty_mod+v paste_from_clipboard
# map cmd+v       paste_from_clipboard

#: Colar da seleção

# map kitty_mod+s  paste_from_selection
# map shift+insert paste_from_selection

#: Passar seleção para o programa

# map kitty_mod+o pass_selection_to_program

#::  Você também pode passar o conteúdo da seleção atual para
#::  qualquer programa com pass_selection_to_program. Por padrão, o
#::  programa de abertura do sistema é usado, mas você pode
#::  especificar o seu próprio; a seleção será passada como um
#::  argumento de linha de comando para o programa. Por exemplo::

#::      map kitty_mod+o pass_selection_to_program firefox

#::  Você pode passar a seleção atual para um programa de terminal em
#::  execução em uma nova janela do kitty, usando o placeholder
#::  @selection::

#::      map kitty_mod+y new_window less @selection

#: }}}

#: Rolagem {{{

#: Rolar linha para cima

# map kitty_mod+up    scroll_line_up
# map kitty_mod+k     scroll_line_up
# map opt+cmd+page_up scroll_line_up
# map cmd+up          scroll_line_up

#: Rolar linha para baixo

# map kitty_mod+down    scroll_line_down
# map kitty_mod+j       scroll_line_down
# map opt+cmd+page_down scroll_line_down
# map cmd+down          scroll_line_down

#: Rolar página para cima

# map kitty_mod+page_up scroll_page_up
# map cmd+page_up       scroll_page_up

#: Rolar página para baixo

# map kitty_mod+page_down scroll_page_down
# map cmd+page_down       scroll_page_down

#: Rolar para o topo

# map kitty_mod+home scroll_home
# map cmd+home       scroll_home

#: Rolar para o final

# map kitty_mod+end scroll_end
# map cmd+end       scroll_end

#: Rolar para o prompt de shell anterior

# map kitty_mod+z scroll_to_prompt -1

#::  Use um parâmetro de 0 para scroll_to_prompt para rolar até a
#::  última posição visitada ou o último clique. Requer integração de
#::  shell <https://sw.kovidgoyal.net/kitty/shell-integration/> para
#::  funcionar.

#: Rolar para o próximo prompt de shell

# map kitty_mod+x scroll_to_prompt 1

#: Navegar no buffer de histórico de rolagem no pager

# map kitty_mod+h show_scrollback

#::  Você pode canalizar o conteúdo da tela atual e do buffer de
#::  histórico como STDIN para um programa arbitrário usando launch
#::  --stdin-source. Por exemplo, o seguinte abre o buffer de
#::  histórico de rolagem no less em uma janela sobreposta::

#::      map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R

#::  Para mais detalhes sobre canalizar conteúdo de tela e buffer para
#::  programas externos, veja launch
#::  <https://sw.kovidgoyal.net/kitty/launch/>.

#: Navegar na saída do último comando do shell no pager

# map kitty_mod+g show_last_command_output

#::  Você também pode definir atalhos adicionais para obter a saída
#::  do comando. Por exemplo, para obter a saída do primeiro comando
#::  na tela::

#::      map f1 show_first_command_output_on_screen

#::  Para obter a saída do comando que foi acessado por último por uma
#::  ação de teclado ou mouse::

#::      map f1 show_last_visited_command_output

#::  Você pode canalizar a saída do último comando executado no shell
#::  usando a ação launch. Por exemplo, o seguinte abre a saída no
#::  less em uma janela sobreposta::

#::      map f1 launch --stdin-source=@last_cmd_output --stdin-add-formatting --type=overlay less +G -R

#::  Para obter a saída do primeiro comando na tela, use
#::  @first_cmd_output_on_screen. Para obter a saída do último comando
#::  acessado, use @last_visited_cmd_output.

#::  Requer integração de shell
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> para
#::  funcionar.

#: }}}

#: Gerenciamento de janelas {{{

#: Nova janela

# map kitty_mod+enter new_window
# map cmd+enter       new_window

#::  Você pode abrir uma nova janela do kitty executando um programa
#::  arbitrário, por exemplo::

#::      map kitty_mod+y launch mutt

#::  Você pode abrir uma nova janela com o diretório de trabalho atual
#::  definido para o diretório de trabalho da janela atual usando::

#::      map ctrl+alt+enter launch --cwd=current

#::  Você pode abrir uma nova janela que tem permissão para controlar o
#::  kitty via a facilidade de controle remoto do kitty com launch
#::  --allow-remote-control. Quaisquer programas em execução nessa
#::  janela terão permissão para controlar o kitty. Por exemplo::

#::      map ctrl+enter launch --allow-remote-control some_program

#::  Você pode abrir uma nova janela ao lado da janela atualmente ativa
#::  ou como a primeira janela, com::

#::      map ctrl+n launch --location=neighbor
#::      map ctrl+f launch --location=first

#::  Para mais detalhes, veja launch
#::  <https://sw.kovidgoyal.net/kitty/launch/>.

#: Nova janela do SO

# map kitty_mod+n new_os_window
# map cmd+n       new_os_window

#::  Funciona como new_window acima, exceto que abre uma janela de
#::  nível superior do SO. Em particular, você pode usar
#::  new_os_window_with_cwd para abrir uma janela com o diretório de
#::  trabalho atual.

#: Fechar janela

# map kitty_mod+w close_window
# map shift+cmd+d close_window

#: Próxima janela

# map kitty_mod+] next_window

#: Janela anterior

# map kitty_mod+[ previous_window

#: Mover janela para frente

# map kitty_mod+f move_window_forward

#: Mover janela para trás

# map kitty_mod+b move_window_backward

#: Mover janela para o topo

# map kitty_mod+` move_window_to_top

#: Começar a redimensionar janela

# map kitty_mod+r start_resizing_window
# map cmd+r       start_resizing_window

#: Primeira janela

# map kitty_mod+1 first_window
# map cmd+1       first_window

#: Segunda janela

# map kitty_mod+2 second_window
# map cmd+2       second_window

#: Terceira janela

# map kitty_mod+3 third_window
# map cmd+3       third_window

#: Quarta janela

# map kitty_mod+4 fourth_window
# map cmd+4       fourth_window

#: Quinta janela

# map kitty_mod+5 fifth_window
# map cmd+5       fifth_window

#: Sexta janela

# map kitty_mod+6 sixth_window
# map cmd+6       sixth_window

#: Sétima janela

# map kitty_mod+7 seventh_window
# map cmd+7       seventh_window

#: Oitava janela

# map kitty_mod+8 eighth_window
# map cmd+8       eighth_window

#: Nona janela

# map kitty_mod+9 ninth_window
# map cmd+9       ninth_window

#: Décima janela

# map kitty_mod+0 tenth_window

#: Selecionar e focar janela visualmente

# map kitty_mod+f7 focus_visible_window

#::  Exibe números e alfabetos de sobreposição na janela, e muda o
#::  foco para a janela quando você pressiona a tecla. Quando há apenas
#::  duas janelas, o foco será alternado diretamente sem exibir a
#::  sobreposição. Você pode alterar os caracteres de sobreposição e
#::  sua ordem com a opção visual_window_select_characters.

#: Trocar janela visualmente com outra

# map kitty_mod+f8 swap_with_window

#::  Funciona como focus_visible_window acima, mas troca a janela.

#: }}}

#: Gerenciamento de abas {{{

#: Próxima aba

# map kitty_mod+right next_tab
# map shift+cmd+]     next_tab
# map ctrl+tab        next_tab

#: Aba anterior

# map kitty_mod+left previous_tab
# map shift+cmd+[    previous_tab
# map ctrl+shift+tab previous_tab

#: Nova aba

# map kitty_mod+t new_tab
# map cmd+t       new_tab

#: Fechar aba

# map kitty_mod+q close_tab
# map cmd+w       close_tab

#: Fechar janela do SO

# map shift+cmd+w close_os_window

#: Mover aba para frente

# map kitty_mod+. move_tab_forward

#: Mover aba para trás

# map kitty_mod+, move_tab_backward

#: Definir título da aba

# map kitty_mod+alt+t set_tab_title
# map shift+cmd+i     set_tab_title


#: Você também pode criar atalhos para ir para abas específicas, com
#: 1 sendo a primeira aba, 2 a segunda aba e -1 sendo a aba
#: anteriormente ativa, -2 sendo a aba ativa antes da anteriormente
#: ativa e assim por diante. Qualquer número maior que o número de
#: abas vai para a última aba e qualquer número menor que o número de
#: abas usadas anteriormente no histórico vai para a aba usada
#: anteriormente mais antiga no histórico::

#:     map ctrl+alt+1 goto_tab 1
#:     map ctrl+alt+2 goto_tab 2

#: Assim como com new_window acima, você também pode passar o nome de
#: comandos arbitrários para executar ao usar new_tab e
#: new_tab_with_cwd. Finalmente, se você quiser que a nova aba abra ao
#: lado da aba atual em vez de no final da lista de abas, use::

#:     map ctrl+t new_tab !neighbor [comando opcional para executar]
#: }}}

#: Gerenciamento de layout {{{

#: Próximo layout

# map kitty_mod+l next_layout


#: Você também pode criar atalhos para alternar para layouts
#: específicos::

#:     map ctrl+alt+t goto_layout tall
#:     map ctrl+alt+s goto_layout stack

#: Similarmente, para voltar ao layout anterior::

#:     map ctrl+alt+p last_used_layout

#: Há também uma ação toggle_layout que alterna para o layout nomeado
#: ou de volta para o layout anterior se estiver no layout nomeado.
#: Útil para temporariamente "dar zoom" na janela ativa alternando
#: para o layout stack::

#:     map ctrl+alt+z toggle_layout stack
#: }}}

#: Tamanhos de fonte {{{

#: Você pode alterar o tamanho da fonte para todas as janelas do SO de
#: nível superior do kitty de uma vez ou apenas para a atual.

#: Aumentar tamanho da fonte

# map kitty_mod+equal  change_font_size all +2.0
# map kitty_mod+plus   change_font_size all +2.0
# map kitty_mod+kp_add change_font_size all +2.0
# map cmd+plus         change_font_size all +2.0
